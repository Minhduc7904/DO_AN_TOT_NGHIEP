receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
  prometheus/rabbitmq:
    config:
      scrape_configs:
        - job_name: rabbitmq-notification
          scrape_interval: 5s
          metrics_path: /metrics/detailed
          params:
            family: [queue_coarse_metrics]
            vhost: ["/"]
            queue: ["${env:NOTIFICATION_GRADE_COMPLETED_QUEUE}"]
          static_configs:
            - targets: [rabbitmq:15692]
          metric_relabel_configs:
            - source_labels: [__name__]
              regex: rabbitmq_detailed_queue_messages(_ready|_unacked)?
              action: keep
            - source_labels: [queue]
              regex: "notification[.]grade-completed[.]v1"
              action: keep
            - regex: queue|vhost
              action: labeldrop

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 192
    spike_limit_mib: 48
  batch:
    timeout: 1s
    send_batch_size: 512
    send_batch_max_size: 1024
  resource/rabbitmq:
    attributes:
      - key: service.name
        value: notification
        action: upsert
      - key: service.version
        value: rabbitmq-4.1.4
        action: upsert
      - key: service.instance.id
        value: rabbitmq-compose-1
        action: upsert
  transform/rabbitmq:
    metric_statements:
      - context: datapoint
        statements:
          - set(attributes["dependency_identity"], "notification-rabbitmq")

exporters:
  otlp_http/tempo:
    endpoint: http://tempo:4318
    retry_on_failure:
      initial_interval: 1s
      max_interval: 5s
      max_elapsed_time: 30s
    sending_queue:
      queue_size: 256
      num_consumers: 2
  prometheus:
    endpoint: 0.0.0.0:8889
    resource_constant_labels:
      included:
        - service.name
        - service.version
        - service.instance.id
  otlp_http/loki:
    endpoint: http://loki:3100/otlp
    retry_on_failure:
      initial_interval: 1s
      max_interval: 5s
      max_elapsed_time: 30s
    sending_queue:
      queue_size: 256
      num_consumers: 2

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp_http/tempo]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [prometheus]
    metrics/rabbitmq:
      receivers: [prometheus/rabbitmq]
      processors: [memory_limiter, resource/rabbitmq, transform/rabbitmq, batch]
      exporters: [prometheus]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp_http/loki]
