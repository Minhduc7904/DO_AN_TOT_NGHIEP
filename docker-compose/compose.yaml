services:
  gateway:
    build:
      context: ../lms
      dockerfile: services/gateway/Dockerfile
    environment:
      NODE_ENV: production
      GATEWAY_AUTH_BASE_URL: http://auth:3001
      GATEWAY_STUDENT_BASE_URL: http://student:3002
      GATEWAY_COURSE_BASE_URL: http://course:3003
      GATEWAY_MEDIA_BASE_URL: http://media:3004
      GATEWAY_NOTIFICATION_BASE_URL: http://notification:3006
      GATEWAY_SCHEDULER_BASE_URL: http://scheduler:3008
      GATEWAY_AI_BASE_URL: http://ai:3009
      SERVICE_CLIENT_ID: gateway
      SERVICE_CLIENT_SECRET: "${GATEWAY_CLIENT_SECRET:-gateway-client-local-only}"
      GATEWAY_UPSTREAM_TIMEOUT_MS: "${GATEWAY_UPSTREAM_TIMEOUT_MS:-5000}"
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: "${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:-http://otel-collector:4318/v1/traces}"
      OTEL_EXPORTER_OTLP_METRICS_ENDPOINT: "${OTEL_EXPORTER_OTLP_METRICS_ENDPOINT:-http://otel-collector:4318/v1/metrics}"
      OTEL_EXPORTER_OTLP_LOGS_ENDPOINT: "${OTEL_EXPORTER_OTLP_LOGS_ENDPOINT:-http://otel-collector:4318/v1/logs}"
      OTEL_METRIC_EXPORT_INTERVAL: "${OTEL_METRIC_EXPORT_INTERVAL:-5000}"
      HTTP_ACCESS_LOG_ENABLED: "${HTTP_ACCESS_LOG_ENABLED:-true}"
      OTEL_SDK_DISABLED: "${OTEL_SDK_DISABLED:-false}"
      OTEL_SERVICE_INSTANCE_ID: "${GATEWAY_SERVICE_INSTANCE_ID:-gateway-compose-1}"
      OTEL_SERVICE_VERSION: "${GATEWAY_SERVICE_VERSION:-0.1.0}"
      PORT: 3000
    ports:
      - "${GATEWAY_PORT:-3000}:3000"
    depends_on:
      auth:
        condition: service_healthy
      student:
        condition: service_healthy
      course:
        condition: service_healthy
      media:
        condition: service_healthy
      notification:
        condition: service_healthy
      scheduler:
        condition: service_healthy
      ai:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:3000/health')
          .then((response) => { if (!response.ok) process.exit(1); })
          .catch(() => process.exit(1));
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    networks:
      - lms-network
      - aiops-net

  auth:
    build:
      context: ../lms
      dockerfile: services/auth/Dockerfile
    environment:
      NODE_ENV: production
      AUTH_DATABASE_URL: "postgresql://${AUTH_POSTGRES_USER:?AUTH_POSTGRES_USER is required}:${AUTH_POSTGRES_PASSWORD:?AUTH_POSTGRES_PASSWORD is required}@postgres:5432/auth_db"
      # Khóa ký Ed25519 (PKCS8 PEM, xuống dòng viết `\n`). Để trống: khóa tạm, đổi mỗi lần khởi động.
      AUTH_SIGNING_KEY_PEM: "${AUTH_SIGNING_KEY_PEM:-}"
      AUTH_ALLOW_EPHEMERAL_SIGNING_KEY: "${AUTH_ALLOW_EPHEMERAL_SIGNING_KEY:-true}"
      AUTH_SERVICE_TOKEN_TTL_SECONDS: "${AUTH_SERVICE_TOKEN_TTL_SECONDS:-600}"
      SERVICE_CLIENT_ID: auth
      SERVICE_CLIENT_SECRET: "${AUTH_CLIENT_SECRET:-auth-client-local-only}"
      # Registry client dịch vụ (ADR-004): gateway được gọi mọi route public; auth gọi student.
      SERVICE_CLIENTS_BOOTSTRAP: '[{"client_id":"gateway","client_secret":"${GATEWAY_CLIENT_SECRET:-gateway-client-local-only}","audiences":["auth","student","course","media","notification","scheduler","ai"],"scopes":["gateway:proxy"]},{"client_id":"auth","client_secret":"${AUTH_CLIENT_SECRET:-auth-client-local-only}","audiences":["student"],"scopes":["student:profile:read","student:profile:write"]},{"client_id":"media","client_secret":"${MEDIA_CLIENT_SECRET:-media-client-local-only}","audiences":["student"],"scopes":["student:profile:read"]},{"client_id":"notification-worker","client_secret":"${NOTIFICATION_WORKER_CLIENT_SECRET:-notification-worker-client-local-only}","audiences":["student"],"scopes":["student:profile:read"]},{"client_id":"course","client_secret":"${COURSE_CLIENT_SECRET:-course-client-local-only}","audiences":["media","ai"],"scopes":["media:usage:read","ai:document:read","ai:document:write","ai:job:read","ai:job:write"]},{"client_id":"ai-worker","client_secret":"${AI_WORKER_CLIENT_SECRET:-ai-worker-client-local-only}","audiences":["course","media"],"scopes":["course:lesson-ai:read","course:lesson-ai:write","media:content:read"]},{"client_id":"scheduler-worker","client_secret":"${SCHEDULER_WORKER_CLIENT_SECRET:-scheduler-worker-client-local-only}","audiences":["media"],"scopes":["media:cleanup"]}]'
      AUTH_STUDENT_BASE_URL: http://student:3002
      AUTH_STUDENT_TIMEOUT_MS: "${AUTH_STUDENT_TIMEOUT_MS:-3000}"
      AUTH_BOOTSTRAP_ADMIN_ID: "${AUTH_BOOTSTRAP_ADMIN_ID:-00000000-0000-4000-8000-000000000001}"
      AUTH_BOOTSTRAP_ADMIN_EMAIL: "${AUTH_BOOTSTRAP_ADMIN_EMAIL:-admin@example.test}"
      AUTH_BOOTSTRAP_ADMIN_PASSWORD: "${AUTH_BOOTSTRAP_ADMIN_PASSWORD:-example-password}"
      AUTH_BOOTSTRAP_INSTRUCTOR_ID: "${AUTH_BOOTSTRAP_INSTRUCTOR_ID:-22222222-2222-4222-8222-222222222222}"
      AUTH_BOOTSTRAP_INSTRUCTOR_EMAIL: "${AUTH_BOOTSTRAP_INSTRUCTOR_EMAIL:-instructor@example.test}"
      AUTH_BOOTSTRAP_INSTRUCTOR_PASSWORD: "${AUTH_BOOTSTRAP_INSTRUCTOR_PASSWORD:-example-password}"
      AUTH_BOOTSTRAP_STUDENT_ID: "${AUTH_BOOTSTRAP_STUDENT_ID:-11111111-1111-4111-8111-111111111111}"
      AUTH_BOOTSTRAP_STUDENT_EMAIL: "${AUTH_BOOTSTRAP_STUDENT_EMAIL:-student@example.test}"
      AUTH_BOOTSTRAP_STUDENT_PASSWORD: "${AUTH_BOOTSTRAP_STUDENT_PASSWORD:-example-password}"
      AUTH_JWT_TTL_SECONDS: "${AUTH_JWT_TTL_SECONDS:-3600}"
      AUTH_REFRESH_TTL_SECONDS: "${AUTH_REFRESH_TTL_SECONDS:-86400}"
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: "${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:-http://otel-collector:4318/v1/traces}"
      OTEL_EXPORTER_OTLP_METRICS_ENDPOINT: "${OTEL_EXPORTER_OTLP_METRICS_ENDPOINT:-http://otel-collector:4318/v1/metrics}"
      OTEL_EXPORTER_OTLP_LOGS_ENDPOINT: "${OTEL_EXPORTER_OTLP_LOGS_ENDPOINT:-http://otel-collector:4318/v1/logs}"
      OTEL_METRIC_EXPORT_INTERVAL: "${OTEL_METRIC_EXPORT_INTERVAL:-5000}"
      HTTP_ACCESS_LOG_ENABLED: "${HTTP_ACCESS_LOG_ENABLED:-true}"
      OTEL_SDK_DISABLED: "${OTEL_SDK_DISABLED:-false}"
      OTEL_SERVICE_INSTANCE_ID: "${AUTH_SERVICE_INSTANCE_ID:-auth-compose-1}"
      OTEL_SERVICE_VERSION: "${AUTH_SERVICE_VERSION:-0.1.0}"
      PORT: 3001
    ports:
      - "${AUTH_PORT:-3001}:3001"
    depends_on:
      postgres:
        condition: service_healthy
      student:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:3001/ready')
          .then((response) => { if (!response.ok) process.exit(1); })
          .catch(() => process.exit(1));
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    networks:
      - lms-network
      - aiops-net

  course:
    build:
      context: ../lms
      dockerfile: services/course/Dockerfile
    environment:
      NODE_ENV: production
      COURSE_DATABASE_URL: "postgresql://${COURSE_POSTGRES_USER:-course_user}:${COURSE_POSTGRES_PASSWORD:-course-local-only}@postgres:5432/course_db"
      COURSE_RABBITMQ_URL: "amqp://${RABBITMQ_DEFAULT_USER:-lms}:${RABBITMQ_DEFAULT_PASS:-lms-local-only}@rabbitmq:5672"
      COURSE_MEDIA_BASE_URL: http://media:3004
      COURSE_MEDIA_TIMEOUT_MS: "${COURSE_MEDIA_TIMEOUT_MS:-3000}"
      COURSE_AI_BASE_URL: http://ai:3009
      COURSE_AI_TIMEOUT_MS: "${COURSE_AI_TIMEOUT_MS:-5000}"
      AUTH_BASE_URL: http://auth:3001
      SERVICE_CLIENT_ID: course
      SERVICE_CLIENT_SECRET: "${COURSE_CLIENT_SECRET:-course-client-local-only}"
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: "${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:-http://otel-collector:4318/v1/traces}"
      OTEL_EXPORTER_OTLP_METRICS_ENDPOINT: "${OTEL_EXPORTER_OTLP_METRICS_ENDPOINT:-http://otel-collector:4318/v1/metrics}"
      OTEL_EXPORTER_OTLP_LOGS_ENDPOINT: "${OTEL_EXPORTER_OTLP_LOGS_ENDPOINT:-http://otel-collector:4318/v1/logs}"
      OTEL_METRIC_EXPORT_INTERVAL: "${OTEL_METRIC_EXPORT_INTERVAL:-5000}"
      HTTP_ACCESS_LOG_ENABLED: "${HTTP_ACCESS_LOG_ENABLED:-true}"
      OTEL_SDK_DISABLED: "${OTEL_SDK_DISABLED:-false}"
      OTEL_SERVICE_INSTANCE_ID: "${COURSE_SERVICE_INSTANCE_ID:-course-compose-1}"
      OTEL_SERVICE_VERSION: "${COURSE_SERVICE_VERSION:-0.1.0}"
      PORT: 3003
    ports:
      - "${COURSE_PORT:-3003}:3003"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:3003/ready')
          .then((response) => { if (!response.ok) process.exit(1); })
          .catch(() => process.exit(1));
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    networks:
      - lms-network
      - aiops-net

  media:
    build:
      context: ../lms
      dockerfile: services/media/Dockerfile
    environment:
      NODE_ENV: production
      MEDIA_DATABASE_URL: "postgresql://${MEDIA_POSTGRES_USER:-media_user}:${MEDIA_POSTGRES_PASSWORD:-media-local-only}@postgres:5432/media_db"
      MEDIA_RABBITMQ_URL: "amqp://${RABBITMQ_DEFAULT_USER:-lms}:${RABBITMQ_DEFAULT_PASS:-lms-local-only}@rabbitmq:5672"
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_USE_SSL: "false"
      MINIO_ACCESS_KEY: "${MINIO_ROOT_USER:-lms-minio}"
      MINIO_SECRET_KEY: "${MINIO_ROOT_PASSWORD:-lms-minio-local-only}"
      # Địa chỉ MinIO mà trình duyệt truy cập được (ký presigned POST cho upload trực tiếp).
      MINIO_PUBLIC_URL: "${MINIO_PUBLIC_URL:-http://localhost:9000}"
      MEDIA_UPLOAD_EXPIRES_SECONDS: "${MEDIA_UPLOAD_EXPIRES_SECONDS:-900}"
      MEDIA_MULTIPART_MAX_BYTES: "${MEDIA_MULTIPART_MAX_BYTES:-26214400}"
      # Tuổi tối thiểu (giờ) của media không dùng trước khi dọn; regression đặt 0 để dọn được ngay.
      MEDIA_CLEANUP_MIN_RETENTION_HOURS: "${MEDIA_CLEANUP_MIN_RETENTION_HOURS:-1}"
      MEDIA_STUDENT_BASE_URL: http://student:3002
      MEDIA_STUDENT_TIMEOUT_MS: "${MEDIA_STUDENT_TIMEOUT_MS:-3000}"
      AUTH_BASE_URL: http://auth:3001
      SERVICE_CLIENT_ID: media
      SERVICE_CLIENT_SECRET: "${MEDIA_CLIENT_SECRET:-media-client-local-only}"
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: "${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:-http://otel-collector:4318/v1/traces}"
      OTEL_EXPORTER_OTLP_METRICS_ENDPOINT: "${OTEL_EXPORTER_OTLP_METRICS_ENDPOINT:-http://otel-collector:4318/v1/metrics}"
      OTEL_EXPORTER_OTLP_LOGS_ENDPOINT: "${OTEL_EXPORTER_OTLP_LOGS_ENDPOINT:-http://otel-collector:4318/v1/logs}"
      OTEL_METRIC_EXPORT_INTERVAL: "${OTEL_METRIC_EXPORT_INTERVAL:-5000}"
      HTTP_ACCESS_LOG_ENABLED: "${HTTP_ACCESS_LOG_ENABLED:-true}"
      OTEL_SDK_DISABLED: "${OTEL_SDK_DISABLED:-false}"
      OTEL_SERVICE_INSTANCE_ID: "${MEDIA_SERVICE_INSTANCE_ID:-media-compose-1}"
      OTEL_SERVICE_VERSION: "${MEDIA_SERVICE_VERSION:-0.1.0}"
      PORT: 3004
    ports:
      - "${MEDIA_PORT:-3004}:3004"
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:3004/ready')
          .then((response) => { if (!response.ok) process.exit(1); })
          .catch(() => process.exit(1));
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    networks:
      - lms-network
      - aiops-net

  media-worker:
    build:
      context: ../lms
      dockerfile: services/media/Dockerfile
    # Cùng image với `media`, chạy entrypoint worker (consumer RabbitMQ, thumbnail, đồng bộ usage).
    command: ["node", "dist/worker.js"]
    environment:
      NODE_ENV: production
      MEDIA_DATABASE_URL: "postgresql://${MEDIA_POSTGRES_USER:-media_user}:${MEDIA_POSTGRES_PASSWORD:-media-local-only}@postgres:5432/media_db"
      MEDIA_RABBITMQ_URL: "amqp://${RABBITMQ_DEFAULT_USER:-lms}:${RABBITMQ_DEFAULT_PASS:-lms-local-only}@rabbitmq:5672"
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_USE_SSL: "false"
      MINIO_ACCESS_KEY: "${MINIO_ROOT_USER:-lms-minio}"
      MINIO_SECRET_KEY: "${MINIO_ROOT_PASSWORD:-lms-minio-local-only}"
      MEDIA_WORKER_PREFETCH: "${MEDIA_WORKER_PREFETCH:-4}"
      MEDIA_WORKER_MAX_ATTEMPTS: "${MEDIA_WORKER_MAX_ATTEMPTS:-5}"
      MEDIA_WORKER_RETRY_DELAY_MS: "${MEDIA_WORKER_RETRY_DELAY_MS:-1000}"
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: "${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:-http://otel-collector:4318/v1/traces}"
      OTEL_EXPORTER_OTLP_METRICS_ENDPOINT: "${OTEL_EXPORTER_OTLP_METRICS_ENDPOINT:-http://otel-collector:4318/v1/metrics}"
      OTEL_EXPORTER_OTLP_LOGS_ENDPOINT: "${OTEL_EXPORTER_OTLP_LOGS_ENDPOINT:-http://otel-collector:4318/v1/logs}"
      OTEL_METRIC_EXPORT_INTERVAL: "${OTEL_METRIC_EXPORT_INTERVAL:-5000}"
      HTTP_ACCESS_LOG_ENABLED: "${HTTP_ACCESS_LOG_ENABLED:-true}"
      OTEL_SDK_DISABLED: "${OTEL_SDK_DISABLED:-false}"
      OTEL_SERVICE_INSTANCE_ID: "${MEDIA_WORKER_SERVICE_INSTANCE_ID:-media-worker-compose-1}"
      OTEL_SERVICE_VERSION: "${MEDIA_SERVICE_VERSION:-0.1.0}"
      PORT: 3005
    ports:
      - "${MEDIA_WORKER_PORT:-3005}:3005"
    # Chờ `media` healthy để schema đã migrate trước khi worker tiêu thụ command.
    depends_on:
      media:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:3005/ready')
          .then((response) => { if (!response.ok) process.exit(1); })
          .catch(() => process.exit(1));
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    networks:
      - lms-network
      - aiops-net

  notification:
    build:
      context: ../lms
      dockerfile: services/notification/Dockerfile
    environment:
      NODE_ENV: production
      NOTIFICATION_DATABASE_URL: "postgresql://${NOTIFICATION_POSTGRES_USER:-notification_user}:${NOTIFICATION_POSTGRES_PASSWORD:-notification-local-only}@postgres:5432/notification_db"
      NOTIFICATION_RABBITMQ_URL: "amqp://${RABBITMQ_DEFAULT_USER:-lms}:${RABBITMQ_DEFAULT_PASS:-lms-local-only}@rabbitmq:5672"
      AUTH_BASE_URL: http://auth:3001
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: "${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:-http://otel-collector:4318/v1/traces}"
      OTEL_EXPORTER_OTLP_METRICS_ENDPOINT: "${OTEL_EXPORTER_OTLP_METRICS_ENDPOINT:-http://otel-collector:4318/v1/metrics}"
      OTEL_EXPORTER_OTLP_LOGS_ENDPOINT: "${OTEL_EXPORTER_OTLP_LOGS_ENDPOINT:-http://otel-collector:4318/v1/logs}"
      OTEL_METRIC_EXPORT_INTERVAL: "${OTEL_METRIC_EXPORT_INTERVAL:-5000}"
      HTTP_ACCESS_LOG_ENABLED: "${HTTP_ACCESS_LOG_ENABLED:-true}"
      OTEL_SDK_DISABLED: "${OTEL_SDK_DISABLED:-false}"
      OTEL_SERVICE_INSTANCE_ID: "${NOTIFICATION_SERVICE_INSTANCE_ID:-notification-compose-1}"
      OTEL_SERVICE_VERSION: "${NOTIFICATION_SERVICE_VERSION:-0.1.0}"
      PORT: 3006
    ports:
      - "${NOTIFICATION_PORT:-3006}:3006"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:3006/ready')
          .then((response) => { if (!response.ok) process.exit(1); })
          .catch(() => process.exit(1));
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    networks:
      - lms-network
      - aiops-net

  notification-worker:
    build:
      context: ../lms
      dockerfile: services/notification/Dockerfile
    # Cùng image với `notification`, chạy entrypoint worker (snapshot recipient, gửi email SMTP).
    command: ["node", "dist/worker.js"]
    environment:
      NODE_ENV: production
      NOTIFICATION_DATABASE_URL: "postgresql://${NOTIFICATION_POSTGRES_USER:-notification_user}:${NOTIFICATION_POSTGRES_PASSWORD:-notification-local-only}@postgres:5432/notification_db"
      NOTIFICATION_RABBITMQ_URL: "amqp://${RABBITMQ_DEFAULT_USER:-lms}:${RABBITMQ_DEFAULT_PASS:-lms-local-only}@rabbitmq:5672"
      NOTIFICATION_STUDENT_BASE_URL: http://student:3002
      NOTIFICATION_STUDENT_TIMEOUT_MS: "${NOTIFICATION_STUDENT_TIMEOUT_MS:-3000}"
      NOTIFICATION_SMTP_HOST: mailpit
      NOTIFICATION_SMTP_PORT: 1025
      NOTIFICATION_SMTP_FROM: "${NOTIFICATION_SMTP_FROM:-LMS <no-reply@lms.local>}"
      NOTIFICATION_WORKER_PREFETCH: "${NOTIFICATION_WORKER_PREFETCH:-4}"
      NOTIFICATION_WORKER_MAX_ATTEMPTS: "${NOTIFICATION_WORKER_MAX_ATTEMPTS:-5}"
      NOTIFICATION_WORKER_RETRY_DELAY_MS: "${NOTIFICATION_WORKER_RETRY_DELAY_MS:-1000}"
      NOTIFICATION_DISPATCH_CONCURRENCY: "${NOTIFICATION_DISPATCH_CONCURRENCY:-5}"
      AUTH_BASE_URL: http://auth:3001
      SERVICE_CLIENT_ID: notification-worker
      SERVICE_CLIENT_SECRET: "${NOTIFICATION_WORKER_CLIENT_SECRET:-notification-worker-client-local-only}"
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: "${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:-http://otel-collector:4318/v1/traces}"
      OTEL_EXPORTER_OTLP_METRICS_ENDPOINT: "${OTEL_EXPORTER_OTLP_METRICS_ENDPOINT:-http://otel-collector:4318/v1/metrics}"
      OTEL_EXPORTER_OTLP_LOGS_ENDPOINT: "${OTEL_EXPORTER_OTLP_LOGS_ENDPOINT:-http://otel-collector:4318/v1/logs}"
      OTEL_METRIC_EXPORT_INTERVAL: "${OTEL_METRIC_EXPORT_INTERVAL:-5000}"
      HTTP_ACCESS_LOG_ENABLED: "${HTTP_ACCESS_LOG_ENABLED:-true}"
      OTEL_SDK_DISABLED: "${OTEL_SDK_DISABLED:-false}"
      OTEL_SERVICE_INSTANCE_ID: "${NOTIFICATION_WORKER_SERVICE_INSTANCE_ID:-notification-worker-compose-1}"
      OTEL_SERVICE_VERSION: "${NOTIFICATION_SERVICE_VERSION:-0.1.0}"
      PORT: 3007
    ports:
      - "${NOTIFICATION_WORKER_PORT:-3007}:3007"
    # Chờ `notification` healthy để schema đã migrate trước khi worker tiêu thụ command.
    depends_on:
      notification:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:3007/ready')
          .then((response) => { if (!response.ok) process.exit(1); })
          .catch(() => process.exit(1));
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    networks:
      - lms-network
      - aiops-net

  ai:
    build:
      context: ../lms
      dockerfile: services/ai/Dockerfile
    environment:
      NODE_ENV: production
      AI_DATABASE_URL: "postgresql://${AI_POSTGRES_USER:-ai_user}:${AI_POSTGRES_PASSWORD:-ai-local-only}@postgres:5432/ai_db"
      # Khóa AES-256 (base64 của 32 byte) mã hóa API key provider; khóa mẫu chỉ dành cho local, mất/đổi khóa thì API key đã lưu không giải mã được.
      AI_ENCRYPTION_KEY: "${AI_ENCRYPTION_KEY:-bG9jYWwtb25seS1haS1lbmNyeXB0aW9uLWtleS0zMmI=}"
      AI_COMPLETION_TIMEOUT_MS: "${AI_COMPLETION_TIMEOUT_MS:-240000}"
      AI_HEALTH_CHECK_TIMEOUT_MS: "${AI_HEALTH_CHECK_TIMEOUT_MS:-6000}"
      AI_RABBITMQ_URL: "amqp://${RABBITMQ_DEFAULT_USER:-lms}:${RABBITMQ_DEFAULT_PASS:-lms-local-only}@rabbitmq:5672"
      AUTH_BASE_URL: http://auth:3001
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: "${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:-http://otel-collector:4318/v1/traces}"
      OTEL_EXPORTER_OTLP_METRICS_ENDPOINT: "${OTEL_EXPORTER_OTLP_METRICS_ENDPOINT:-http://otel-collector:4318/v1/metrics}"
      OTEL_EXPORTER_OTLP_LOGS_ENDPOINT: "${OTEL_EXPORTER_OTLP_LOGS_ENDPOINT:-http://otel-collector:4318/v1/logs}"
      OTEL_METRIC_EXPORT_INTERVAL: "${OTEL_METRIC_EXPORT_INTERVAL:-5000}"
      HTTP_ACCESS_LOG_ENABLED: "${HTTP_ACCESS_LOG_ENABLED:-true}"
      OTEL_SDK_DISABLED: "${OTEL_SDK_DISABLED:-false}"
      OTEL_SERVICE_INSTANCE_ID: "${AI_SERVICE_INSTANCE_ID:-ai-compose-1}"
      OTEL_SERVICE_VERSION: "${AI_SERVICE_VERSION:-0.1.0}"
      PORT: 3009
    ports:
      - "${AI_PORT:-3009}:3009"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:3009/ready')
          .then((response) => { if (!response.ok) process.exit(1); })
          .catch(() => process.exit(1));
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    networks:
      - lms-network
      - aiops-net

  ai-worker:
    build:
      context: ../lms
      dockerfile: services/ai/Dockerfile
    # Cùng image với `ai`, chạy entrypoint worker (trích xuất tài liệu, chạy job AI soạn bài).
    command: ["node", "dist/worker.js"]
    environment:
      NODE_ENV: production
      AI_DATABASE_URL: "postgresql://${AI_POSTGRES_USER:-ai_user}:${AI_POSTGRES_PASSWORD:-ai-local-only}@postgres:5432/ai_db"
      AI_ENCRYPTION_KEY: "${AI_ENCRYPTION_KEY:-bG9jYWwtb25seS1haS1lbmNyeXB0aW9uLWtleS0zMmI=}"
      AI_COMPLETION_TIMEOUT_MS: "${AI_COMPLETION_TIMEOUT_MS:-240000}"
      AI_RABBITMQ_URL: "amqp://${RABBITMQ_DEFAULT_USER:-lms}:${RABBITMQ_DEFAULT_PASS:-lms-local-only}@rabbitmq:5672"
      AI_COURSE_BASE_URL: http://course:3003
      AI_MEDIA_BASE_URL: http://media:3004
      AI_MEDIA_CONTENT_TIMEOUT_MS: "${AI_MEDIA_CONTENT_TIMEOUT_MS:-30000}"
      AI_WORKER_PREFETCH: "${AI_WORKER_PREFETCH:-2}"
      AI_WORKER_MAX_ATTEMPTS: "${AI_WORKER_MAX_ATTEMPTS:-5}"
      AI_WORKER_RETRY_DELAY_MS: "${AI_WORKER_RETRY_DELAY_MS:-1000}"
      # Phải lớn hơn AI_COMPLETION_TIMEOUT_MS.
      AI_WORKER_LEASE_MS: "${AI_WORKER_LEASE_MS:-600000}"
      AUTH_BASE_URL: http://auth:3001
      SERVICE_CLIENT_ID: ai-worker
      SERVICE_CLIENT_SECRET: "${AI_WORKER_CLIENT_SECRET:-ai-worker-client-local-only}"
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: "${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:-http://otel-collector:4318/v1/traces}"
      OTEL_EXPORTER_OTLP_METRICS_ENDPOINT: "${OTEL_EXPORTER_OTLP_METRICS_ENDPOINT:-http://otel-collector:4318/v1/metrics}"
      OTEL_EXPORTER_OTLP_LOGS_ENDPOINT: "${OTEL_EXPORTER_OTLP_LOGS_ENDPOINT:-http://otel-collector:4318/v1/logs}"
      OTEL_METRIC_EXPORT_INTERVAL: "${OTEL_METRIC_EXPORT_INTERVAL:-5000}"
      HTTP_ACCESS_LOG_ENABLED: "${HTTP_ACCESS_LOG_ENABLED:-true}"
      OTEL_SDK_DISABLED: "${OTEL_SDK_DISABLED:-false}"
      OTEL_SERVICE_INSTANCE_ID: "${AI_WORKER_SERVICE_INSTANCE_ID:-ai-worker-compose-1}"
      OTEL_SERVICE_VERSION: "${AI_SERVICE_VERSION:-0.1.0}"
      PORT: 3011
    ports:
      - "${AI_WORKER_PORT:-3011}:3011"
    # Chờ `ai` healthy để schema đã migrate trước khi worker tiêu thụ command.
    depends_on:
      ai:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:3011/ready')
          .then((response) => { if (!response.ok) process.exit(1); })
          .catch(() => process.exit(1));
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    networks:
      - lms-network
      - aiops-net

  scheduler:
    build:
      context: ../lms
      dockerfile: services/scheduler/Dockerfile
    environment:
      NODE_ENV: production
      SCHEDULER_DATABASE_URL: "postgresql://${SCHEDULER_POSTGRES_USER:-scheduler_user}:${SCHEDULER_POSTGRES_PASSWORD:-scheduler-local-only}@postgres:5432/scheduler_db"
      AUTH_BASE_URL: http://auth:3001
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: "${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:-http://otel-collector:4318/v1/traces}"
      OTEL_EXPORTER_OTLP_METRICS_ENDPOINT: "${OTEL_EXPORTER_OTLP_METRICS_ENDPOINT:-http://otel-collector:4318/v1/metrics}"
      OTEL_EXPORTER_OTLP_LOGS_ENDPOINT: "${OTEL_EXPORTER_OTLP_LOGS_ENDPOINT:-http://otel-collector:4318/v1/logs}"
      OTEL_METRIC_EXPORT_INTERVAL: "${OTEL_METRIC_EXPORT_INTERVAL:-5000}"
      HTTP_ACCESS_LOG_ENABLED: "${HTTP_ACCESS_LOG_ENABLED:-true}"
      OTEL_SDK_DISABLED: "${OTEL_SDK_DISABLED:-false}"
      OTEL_SERVICE_INSTANCE_ID: "${SCHEDULER_SERVICE_INSTANCE_ID:-scheduler-compose-1}"
      OTEL_SERVICE_VERSION: "${SCHEDULER_SERVICE_VERSION:-0.1.0}"
      PORT: 3008
    ports:
      # Cổng host 3008 thuộc Grafana (aiops-platform), nên scheduler publish ra 3018; trong network vẫn là scheduler:3008.
      - "${SCHEDULER_PORT:-3018}:3008"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:3008/ready')
          .then((response) => { if (!response.ok) process.exit(1); })
          .catch(() => process.exit(1));
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    networks:
      - lms-network
      - aiops-net

  scheduler-worker:
    build:
      context: ../lms
      dockerfile: services/scheduler/Dockerfile
    # Cùng image với `scheduler`, chạy entrypoint worker (nhận run bằng lease, tick CRON, gọi media cleanup).
    command: ["node", "dist/worker.js"]
    environment:
      NODE_ENV: production
      SCHEDULER_DATABASE_URL: "postgresql://${SCHEDULER_POSTGRES_USER:-scheduler_user}:${SCHEDULER_POSTGRES_PASSWORD:-scheduler-local-only}@postgres:5432/scheduler_db"
      SCHEDULER_MEDIA_BASE_URL: http://media:3004
      SCHEDULER_MEDIA_TIMEOUT_MS: "${SCHEDULER_MEDIA_TIMEOUT_MS:-60000}"
      SCHEDULER_WORKER_POLL_MS: "${SCHEDULER_WORKER_POLL_MS:-1000}"
      SCHEDULER_CRON_TICK_MS: "${SCHEDULER_CRON_TICK_MS:-5000}"
      AUTH_BASE_URL: http://auth:3001
      SERVICE_CLIENT_ID: scheduler-worker
      SERVICE_CLIENT_SECRET: "${SCHEDULER_WORKER_CLIENT_SECRET:-scheduler-worker-client-local-only}"
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: "${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:-http://otel-collector:4318/v1/traces}"
      OTEL_EXPORTER_OTLP_METRICS_ENDPOINT: "${OTEL_EXPORTER_OTLP_METRICS_ENDPOINT:-http://otel-collector:4318/v1/metrics}"
      OTEL_EXPORTER_OTLP_LOGS_ENDPOINT: "${OTEL_EXPORTER_OTLP_LOGS_ENDPOINT:-http://otel-collector:4318/v1/logs}"
      OTEL_METRIC_EXPORT_INTERVAL: "${OTEL_METRIC_EXPORT_INTERVAL:-5000}"
      HTTP_ACCESS_LOG_ENABLED: "${HTTP_ACCESS_LOG_ENABLED:-true}"
      OTEL_SDK_DISABLED: "${OTEL_SDK_DISABLED:-false}"
      OTEL_SERVICE_INSTANCE_ID: "${SCHEDULER_WORKER_SERVICE_INSTANCE_ID:-scheduler-worker-compose-1}"
      OTEL_SERVICE_VERSION: "${SCHEDULER_SERVICE_VERSION:-0.1.0}"
      PORT: 3010
    ports:
      - "${SCHEDULER_WORKER_PORT:-3010}:3010"
    # Chờ `scheduler` healthy để schema đã migrate; media phải sống để job cleanup gọi được.
    depends_on:
      scheduler:
        condition: service_healthy
      media:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:3010/ready')
          .then((response) => { if (!response.ok) process.exit(1); })
          .catch(() => process.exit(1));
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    networks:
      - lms-network
      - aiops-net

  student:
    build:
      context: ../lms
      dockerfile: services/student/Dockerfile
    environment:
      NODE_ENV: production
      STUDENT_DATABASE_URL: "postgresql://${STUDENT_POSTGRES_USER:-student_user}:${STUDENT_POSTGRES_PASSWORD:-student-local-only}@postgres:5432/student_db"
      AUTH_BASE_URL: http://auth:3001
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: "${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:-http://otel-collector:4318/v1/traces}"
      OTEL_EXPORTER_OTLP_METRICS_ENDPOINT: "${OTEL_EXPORTER_OTLP_METRICS_ENDPOINT:-http://otel-collector:4318/v1/metrics}"
      OTEL_EXPORTER_OTLP_LOGS_ENDPOINT: "${OTEL_EXPORTER_OTLP_LOGS_ENDPOINT:-http://otel-collector:4318/v1/logs}"
      OTEL_METRIC_EXPORT_INTERVAL: "${OTEL_METRIC_EXPORT_INTERVAL:-5000}"
      HTTP_ACCESS_LOG_ENABLED: "${HTTP_ACCESS_LOG_ENABLED:-true}"
      OTEL_SDK_DISABLED: "${OTEL_SDK_DISABLED:-false}"
      OTEL_SERVICE_INSTANCE_ID: "${STUDENT_SERVICE_INSTANCE_ID:-student-compose-1}"
      OTEL_SERVICE_VERSION: "${STUDENT_SERVICE_VERSION:-0.1.0}"
      PORT: 3002
    ports:
      - "${STUDENT_PORT:-3012}:3002"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:3002/ready')
          .then((response) => { if (!response.ok) process.exit(1); })
          .catch(() => process.exit(1));
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    networks:
      - lms-network
      - aiops-net

  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-postgres}"
      POSTGRES_USER: "${POSTGRES_USER:-lms}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-lms-local-only}"
      AUTH_POSTGRES_USER: "${AUTH_POSTGRES_USER:?AUTH_POSTGRES_USER is required}"
      AUTH_POSTGRES_PASSWORD: "${AUTH_POSTGRES_PASSWORD:?AUTH_POSTGRES_PASSWORD is required}"
      STUDENT_POSTGRES_USER: "${STUDENT_POSTGRES_USER:-student_user}"
      STUDENT_POSTGRES_PASSWORD: "${STUDENT_POSTGRES_PASSWORD:-student-local-only}"
      COURSE_POSTGRES_USER: "${COURSE_POSTGRES_USER:-course_user}"
      COURSE_POSTGRES_PASSWORD: "${COURSE_POSTGRES_PASSWORD:-course-local-only}"
      MEDIA_POSTGRES_USER: "${MEDIA_POSTGRES_USER:-media_user}"
      MEDIA_POSTGRES_PASSWORD: "${MEDIA_POSTGRES_PASSWORD:-media-local-only}"
      NOTIFICATION_POSTGRES_USER: "${NOTIFICATION_POSTGRES_USER:-notification_user}"
      NOTIFICATION_POSTGRES_PASSWORD: "${NOTIFICATION_POSTGRES_PASSWORD:-notification-local-only}"
      SCHEDULER_POSTGRES_USER: "${SCHEDULER_POSTGRES_USER:-scheduler_user}"
      SCHEDULER_POSTGRES_PASSWORD: "${SCHEDULER_POSTGRES_PASSWORD:-scheduler-local-only}"
      AI_POSTGRES_USER: "${AI_POSTGRES_USER:-ai_user}"
      AI_POSTGRES_PASSWORD: "${AI_POSTGRES_PASSWORD:-ai-local-only}"
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -h 127.0.0.1 -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - lms-network

  minio:
    image: bitnamilegacy/minio:2025.7.23-debian-12-r5
    environment:
      MINIO_DEFAULT_BUCKETS: ""
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:-lms-minio}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:-lms-minio-local-only}"
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/bitnami/minio/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    networks:
      - lms-network
      - aiops-net

  # Tạo bucket do service `media` sở hữu rồi nằm chờ; service khác không truy cập MinIO.

  minio-init:
    image: bitnamilegacy/minio-client:2025.7.21-debian-12-r3
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:-lms-minio}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:-lms-minio-local-only}"
    entrypoint:
      - /bin/sh
      - -c
      - >-
        until mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"; do sleep 2; done &&
        for bucket in images videos documents audios other; do mc mb --ignore-existing "local/$$bucket"; done &&
        touch /tmp/buckets-ready && exec tail -f /dev/null
    # Giữ container chạy sau khi tạo bucket: `up --wait` coi container đã thoát là lỗi, và service
    # phụ thuộc có thể chờ `service_healthy` thay vì `service_completed_successfully`.
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/buckets-ready"]
      interval: 3s
      timeout: 2s
      retries: 20
    networks:
      - lms-network

  mailpit:
    image: axllent/mailpit:v1.31.6
    environment:
      MP_MAX_MESSAGES: 5000
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks:
      - lms-network

  rabbitmq:
    image: rabbitmq:4.1.4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: "${RABBITMQ_DEFAULT_USER:-lms}"
      RABBITMQ_DEFAULT_PASS: "${RABBITMQ_DEFAULT_PASS:-lms-local-only}"
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test:
        - CMD
        - rabbitmq-diagnostics
        - -q
        - ping
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - lms-network
      - aiops-net

networks:
  lms-network:
    driver: bridge
  # Network nối với aiops-platform/observability; định nghĩa giống hệt file compose bên đó.
  aiops-net:
    name: "${AIOPS_NETWORK_NAME:-aiops-net}"
    driver: bridge

volumes:
  minio-data:
  postgres-data:
  rabbitmq-data:
