services:
  gateway:
    build:
      context: ../lms
      dockerfile: services/gateway/Dockerfile
    environment:
      NODE_ENV: production
      GATEWAY_AUTH_BASE_URL: http://auth:3001
      GATEWAY_COURSE_BASE_URL: http://course:3002
      GATEWAY_ENROLLMENT_BASE_URL: http://enrollment:3003
      GATEWAY_SUBMISSION_BASE_URL: http://submission:3004
      GATEWAY_GRADING_BASE_URL: http://grading:3007
      GATEWAY_JWT_SECRET: "${AUTH_JWT_SECRET:-local-development-only-jwt-secret-change-before-production}"
      GATEWAY_UPSTREAM_TIMEOUT_MS: "${GATEWAY_UPSTREAM_TIMEOUT_MS:-5000}"
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: "${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:-http://otel-collector:4318/v1/traces}"
      OTEL_SDK_DISABLED: "${OTEL_SDK_DISABLED:-false}"
      OTEL_SERVICE_INSTANCE_ID: "${GATEWAY_SERVICE_INSTANCE_ID:-gateway-compose-1}"
      OTEL_SERVICE_VERSION: "${GATEWAY_SERVICE_VERSION:-0.1.0}"
      PORT: 3000
    ports:
      - "${GATEWAY_PORT:-3000}:3000"
    depends_on:
      auth:
        condition: service_healthy
      course:
        condition: service_healthy
      enrollment:
        condition: service_healthy
      submission:
        condition: service_healthy
      grading:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:3000/health')
          .then((response) => { if (!response.ok) process.exit(1); })
          .catch(() => process.exit(1));
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    networks:
      - lms-network

  auth:
    build:
      context: ../lms
      dockerfile: services/auth/Dockerfile
    environment:
      NODE_ENV: production
      AUTH_DATABASE_URL: "postgresql://${AUTH_POSTGRES_USER:?AUTH_POSTGRES_USER is required}:${AUTH_POSTGRES_PASSWORD:?AUTH_POSTGRES_PASSWORD is required}@postgres:5432/auth_db"
      AUTH_JWT_SECRET: "${AUTH_JWT_SECRET:-local-development-only-jwt-secret-change-before-production}"
      AUTH_JWT_TTL_SECONDS: "${AUTH_JWT_TTL_SECONDS:-3600}"
      AUTH_REFRESH_TTL_SECONDS: "${AUTH_REFRESH_TTL_SECONDS:-86400}"
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: "${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:-http://otel-collector:4318/v1/traces}"
      OTEL_SDK_DISABLED: "${OTEL_SDK_DISABLED:-false}"
      OTEL_SERVICE_INSTANCE_ID: "${AUTH_SERVICE_INSTANCE_ID:-auth-compose-1}"
      OTEL_SERVICE_VERSION: "${AUTH_SERVICE_VERSION:-0.1.0}"
      PORT: 3001
    ports:
      - "${AUTH_PORT:-3001}:3001"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:3001/health')
          .then((response) => { if (!response.ok) process.exit(1); })
          .catch(() => process.exit(1));
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    networks:
      - lms-network

  course:
    build:
      context: ../lms
      dockerfile: services/course/Dockerfile
    environment:
      NODE_ENV: production
      COURSE_DATABASE_URL: "postgresql://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/course_db"
      COURSE_REDIS_URL: redis://redis:6379
      COURSE_CACHE_TTL_SECONDS: "${COURSE_CACHE_TTL_SECONDS:-60}"
      COURSE_CACHE_TIMEOUT_MS: "${COURSE_CACHE_TIMEOUT_MS:-300}"
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: "${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:-http://otel-collector:4318/v1/traces}"
      OTEL_SDK_DISABLED: "${OTEL_SDK_DISABLED:-false}"
      OTEL_SERVICE_INSTANCE_ID: "${COURSE_SERVICE_INSTANCE_ID:-course-compose-1}"
      OTEL_SERVICE_VERSION: "${COURSE_SERVICE_VERSION:-0.1.0}"
      PORT: 3002
    ports:
      - "${COURSE_PORT:-3002}:3002"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:3002/health')
          .then((response) => { if (!response.ok) process.exit(1); })
          .catch(() => process.exit(1));
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    networks:
      - lms-network

  enrollment:
    build:
      context: ../lms
      dockerfile: services/enrollment/Dockerfile
    environment:
      NODE_ENV: production
      ENROLLMENT_DATABASE_URL: "postgresql://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/enrollment_db"
      ENROLLMENT_COURSE_BASE_URL: http://course:3002
      ENROLLMENT_COURSE_TIMEOUT_MS: "${ENROLLMENT_COURSE_TIMEOUT_MS:-3000}"
      ENROLLMENT_COURSE_BREAKER_THRESHOLD: "${ENROLLMENT_COURSE_BREAKER_THRESHOLD:-3}"
      ENROLLMENT_COURSE_BREAKER_COOLDOWN_MS: "${ENROLLMENT_COURSE_BREAKER_COOLDOWN_MS:-5000}"
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: "${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:-http://otel-collector:4318/v1/traces}"
      OTEL_SDK_DISABLED: "${OTEL_SDK_DISABLED:-false}"
      OTEL_SERVICE_INSTANCE_ID: "${ENROLLMENT_SERVICE_INSTANCE_ID:-enrollment-compose-1}"
      OTEL_SERVICE_VERSION: "${ENROLLMENT_SERVICE_VERSION:-0.1.0}"
      PORT: 3003
    ports:
      - "${ENROLLMENT_PORT:-3003}:3003"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:3003/health')
          .then((response) => { if (!response.ok) process.exit(1); })
          .catch(() => process.exit(1));
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    networks:
      - lms-network

  submission:
    build:
      context: ../lms
      dockerfile: services/submission/Dockerfile
    environment:
      NODE_ENV: production
      SUBMISSION_DATABASE_URL: "postgresql://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/submission_db"
      SUBMISSION_COURSE_BASE_URL: http://course:3002
      SUBMISSION_ENROLLMENT_BASE_URL: http://enrollment:3003
      SUBMISSION_STORAGE_BASE_URL: http://submission-storage-mock:3005
      SUBMISSION_DEPENDENCY_TIMEOUT_MS: "${SUBMISSION_DEPENDENCY_TIMEOUT_MS:-3000}"
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: "${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:-http://otel-collector:4318/v1/traces}"
      OTEL_SDK_DISABLED: "${OTEL_SDK_DISABLED:-false}"
      OTEL_SERVICE_INSTANCE_ID: "${SUBMISSION_SERVICE_INSTANCE_ID:-submission-compose-1}"
      OTEL_SERVICE_VERSION: "${SUBMISSION_SERVICE_VERSION:-0.1.0}"
      PORT: 3004
    ports:
      - "${SUBMISSION_PORT:-3004}:3004"
    depends_on:
      postgres:
        condition: service_healthy
      course:
        condition: service_healthy
      enrollment:
        condition: service_healthy
      submission-storage-mock:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:3004/health')
          .then((response) => { if (!response.ok) process.exit(1); })
          .catch(() => process.exit(1));
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    networks:
      - lms-network

  notification:
    build:
      context: ../lms
      dockerfile: services/notification/Dockerfile
    environment:
      NODE_ENV: production
      NOTIFICATION_RABBITMQ_URL: "amqp://${RABBITMQ_DEFAULT_USER:-lms}:${RABBITMQ_DEFAULT_PASS:-lms-local-only}@rabbitmq:5672"
      NOTIFICATION_GRADE_COMPLETED_EXCHANGE: "${NOTIFICATION_GRADE_COMPLETED_EXCHANGE:-lms.events}"
      NOTIFICATION_GRADE_COMPLETED_QUEUE: "${NOTIFICATION_GRADE_COMPLETED_QUEUE:-notification.grade-completed.v1}"
      NOTIFICATION_CONSUMER_PREFETCH: "${NOTIFICATION_CONSUMER_PREFETCH:-1}"
      NOTIFICATION_RECONNECT_DELAY_MS: "${NOTIFICATION_RECONNECT_DELAY_MS:-1000}"
      NOTIFICATION_DEDUP_TTL_SECONDS: "${NOTIFICATION_DEDUP_TTL_SECONDS:-86400}"
      NOTIFICATION_DEDUP_MAX_EVENT_IDS: "${NOTIFICATION_DEDUP_MAX_EVENT_IDS:-10000}"
      NOTIFICATION_CONSUMER_SLOWDOWN_ENABLED: "${NOTIFICATION_CONSUMER_SLOWDOWN_ENABLED:-false}"
      NOTIFICATION_CONSUMER_SLOWDOWN_MS: "${NOTIFICATION_CONSUMER_SLOWDOWN_MS:-0}"
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: "${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:-http://otel-collector:4318/v1/traces}"
      OTEL_SDK_DISABLED: "${OTEL_SDK_DISABLED:-false}"
      OTEL_SERVICE_INSTANCE_ID: "${NOTIFICATION_SERVICE_INSTANCE_ID:-notification-compose-1}"
      OTEL_SERVICE_VERSION: "${NOTIFICATION_SERVICE_VERSION:-0.1.0}"
      PORT: 3006
    ports:
      - "${NOTIFICATION_PORT:-3006}:3006"
    depends_on:
      rabbitmq:
        condition: service_started
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:3006/health')
          .then((response) => { if (!response.ok) process.exit(1); })
          .catch(() => process.exit(1));
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    networks:
      - lms-network

  grading:
    build:
      context: ../lms
      dockerfile: services/grading/Dockerfile
    environment:
      NODE_ENV: production
      GRADING_DATABASE_URL: "postgresql://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/grading_db"
      GRADING_SUBMISSION_BASE_URL: http://submission:3004
      GRADING_DEPENDENCY_TIMEOUT_MS: "${GRADING_DEPENDENCY_TIMEOUT_MS:-3000}"
      GRADING_RABBITMQ_URL: "amqp://${RABBITMQ_DEFAULT_USER:-lms}:${RABBITMQ_DEFAULT_PASS:-lms-local-only}@rabbitmq:5672"
      GRADING_GRADE_COMPLETED_EXCHANGE: "${GRADING_GRADE_COMPLETED_EXCHANGE:-lms.events}"
      GRADING_PUBLISH_CONFIRM_TIMEOUT_MS: "${GRADING_PUBLISH_CONFIRM_TIMEOUT_MS:-3000}"
      GRADING_EVENT_RETRY_INTERVAL_MS: "${GRADING_EVENT_RETRY_INTERVAL_MS:-5000}"
      GRADING_EVENT_RETRY_BATCH_SIZE: "${GRADING_EVENT_RETRY_BATCH_SIZE:-20}"
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: "${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:-http://otel-collector:4318/v1/traces}"
      OTEL_SDK_DISABLED: "${OTEL_SDK_DISABLED:-false}"
      OTEL_SERVICE_INSTANCE_ID: "${GRADING_SERVICE_INSTANCE_ID:-grading-compose-1}"
      OTEL_SERVICE_VERSION: "${GRADING_SERVICE_VERSION:-0.1.0}"
      PORT: 3007
    ports:
      - "${GRADING_PORT:-3007}:3007"
    depends_on:
      postgres:
        condition: service_healthy
      submission:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:3007/health')
          .then((response) => { if (!response.ok) process.exit(1); })
          .catch(() => process.exit(1));
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    networks:
      - lms-network

  submission-storage-mock:
    build:
      context: ../lms
      dockerfile: services/submission-storage-mock/Dockerfile
    environment:
      NODE_ENV: production
      STORAGE_MOCK_DEFAULT_LATENCY_MS: "${STORAGE_MOCK_DEFAULT_LATENCY_MS:-0}"
      STORAGE_MOCK_DEFAULT_ERROR_MODE: "${STORAGE_MOCK_DEFAULT_ERROR_MODE:-none}"
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: "${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:-http://otel-collector:4318/v1/traces}"
      OTEL_SDK_DISABLED: "${OTEL_SDK_DISABLED:-false}"
      OTEL_SERVICE_INSTANCE_ID: "${STORAGE_MOCK_SERVICE_INSTANCE_ID:-submission-storage-compose-1}"
      OTEL_SERVICE_VERSION: "${STORAGE_MOCK_SERVICE_VERSION:-0.1.0}"
      PORT: 3005
    ports:
      - "${STORAGE_MOCK_PORT:-3005}:3005"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:3005/health')
          .then((response) => { if (!response.ok) process.exit(1); })
          .catch(() => process.exit(1));
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    networks:
      - lms-network

  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-course_db}"
      POSTGRES_USER: "${POSTGRES_USER:-lms}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-lms-local-only}"
      AUTH_POSTGRES_USER: "${AUTH_POSTGRES_USER:?AUTH_POSTGRES_USER is required}"
      AUTH_POSTGRES_PASSWORD: "${AUTH_POSTGRES_PASSWORD:?AUTH_POSTGRES_PASSWORD is required}"
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - lms-network

  redis:
    image: redis:8.2.1-alpine
    command:
      - redis-server
      - --appendonly
      - "yes"
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    networks:
      - lms-network

  rabbitmq:
    image: rabbitmq:4.1.4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: "${RABBITMQ_DEFAULT_USER:-lms}"
      RABBITMQ_DEFAULT_PASS: "${RABBITMQ_DEFAULT_PASS:-lms-local-only}"
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test:
        - CMD
        - rabbitmq-diagnostics
        - -q
        - ping
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - lms-network


  otel-collector:
    build:
      context: ./observability
      args:
        BASE_IMAGE: otel/opentelemetry-collector-contrib:0.163.1
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    ports:
      - "127.0.0.1:${OTEL_HTTP_PORT:-4318}:4318"
      - "127.0.0.1:${OTEL_GRPC_PORT:-4317}:4317"
    volumes:
      - ./observability/otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    healthcheck:
      test: ["CMD", "/health-probe", "http://127.0.0.1:13133/"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 10s
    mem_limit: 256m
    cpus: 0.5
    networks: [lms-network]

  prometheus:
    build:
      context: ./observability
      args:
        BASE_IMAGE: prom/prometheus:v3.15.0
        DATA_UID: "65534"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/var/observability
      - --storage.tsdb.retention.time=24h
      - --storage.tsdb.retention.size=512MB
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./observability/prometheus.yaml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/var/observability
    healthcheck:
      test: ["CMD", "/health-probe", "http://127.0.0.1:9090/-/ready"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 10s
    mem_limit: 512m
    cpus: 0.5
    networks: [lms-network]

  tempo:
    build:
      context: ./observability
      args:
        BASE_IMAGE: grafana/tempo:3.1.0
    command: ["-config.file=/etc/tempo.yaml"]
    ports:
      - "127.0.0.1:${TEMPO_PORT:-3200}:3200"
    volumes:
      - ./observability/tempo.yaml:/etc/tempo.yaml:ro
      - tempo-data:/var/observability
    healthcheck:
      test: ["CMD", "/health-probe", "http://127.0.0.1:3200/ready"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 20s
    mem_limit: 512m
    cpus: 0.5
    networks: [lms-network]

  loki:
    build:
      context: ./observability
      args:
        BASE_IMAGE: grafana/loki:3.7.9
    command: ["-config.file=/etc/loki/local-config.yaml"]
    ports:
      - "127.0.0.1:${LOKI_PORT:-3100}:3100"
    volumes:
      - ./observability/loki.yaml:/etc/loki/local-config.yaml:ro
      - loki-data:/var/observability
    healthcheck:
      test: ["CMD", "/health-probe", "http://127.0.0.1:3100/ready"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 20s
    mem_limit: 512m
    cpus: 0.5
    networks: [lms-network]

  grafana:
    build:
      context: ./observability
      args:
        BASE_IMAGE: grafana/grafana:13.2.4
        DATA_UID: "472"
    environment:
      GF_PATHS_DATA: /var/observability
      GF_SECURITY_ADMIN_USER: "${GRAFANA_ADMIN_USER:-admin}"
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:-grafana-local-only}"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3008}:3000"
    volumes:
      - ./observability/grafana-datasources.yaml:/etc/grafana/provisioning/datasources/baseline.yaml:ro
      - grafana-data:/var/observability
    healthcheck:
      test: ["CMD", "/health-probe", "http://127.0.0.1:3000/api/health"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 20s
    mem_limit: 512m
    cpus: 0.5
    networks: [lms-network]

networks:
  lms-network:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  rabbitmq-data:
  prometheus-data:
  tempo-data:
  loki-data:
  grafana-data:
