services:
  gateway:
    build:
      context: ../lms
      dockerfile: services/gateway/Dockerfile
    environment:
      NODE_ENV: production
      GATEWAY_AUTH_BASE_URL: http://auth:3001
      GATEWAY_COURSE_BASE_URL: http://course:3002
      GATEWAY_ENROLLMENT_BASE_URL: http://enrollment:3003
      GATEWAY_SUBMISSION_BASE_URL: http://submission:3004
      GATEWAY_GRADING_BASE_URL: http://grading:3007
      GATEWAY_JWT_SECRET: "${AUTH_JWT_SECRET:-local-development-only-jwt-secret-change-before-production}"
      GATEWAY_UPSTREAM_TIMEOUT_MS: "${GATEWAY_UPSTREAM_TIMEOUT_MS:-5000}"
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: "${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:-http://otel-collector:4318/v1/traces}"
      OTEL_EXPORTER_OTLP_METRICS_ENDPOINT: "${OTEL_EXPORTER_OTLP_METRICS_ENDPOINT:-http://otel-collector:4318/v1/metrics}"
      OTEL_EXPORTER_OTLP_LOGS_ENDPOINT: "${OTEL_EXPORTER_OTLP_LOGS_ENDPOINT:-http://otel-collector:4318/v1/logs}"
      OTEL_METRIC_EXPORT_INTERVAL: "${OTEL_METRIC_EXPORT_INTERVAL:-5000}"
      HTTP_ACCESS_LOG_ENABLED: "${HTTP_ACCESS_LOG_ENABLED:-true}"
      OTEL_SDK_DISABLED: "${OTEL_SDK_DISABLED:-false}"
      OTEL_SERVICE_INSTANCE_ID: "${GATEWAY_SERVICE_INSTANCE_ID:-gateway-compose-1}"
      OTEL_SERVICE_VERSION: "${GATEWAY_SERVICE_VERSION:-0.1.0}"
      PORT: 3000
    ports:
      - "${GATEWAY_PORT:-3000}:3000"
    depends_on:
      auth:
        condition: service_healthy
      course:
        condition: service_healthy
      enrollment:
        condition: service_healthy
      submission:
        condition: service_healthy
      grading:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:3000/health')
          .then((response) => { if (!response.ok) process.exit(1); })
          .catch(() => process.exit(1));
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    networks:
      - lms-network
      - aiops-net

  auth:
    build:
      context: ../lms
      dockerfile: services/auth/Dockerfile
    environment:
      NODE_ENV: production
      AUTH_DATABASE_URL: "postgresql://${AUTH_POSTGRES_USER:?AUTH_POSTGRES_USER is required}:${AUTH_POSTGRES_PASSWORD:?AUTH_POSTGRES_PASSWORD is required}@postgres:5432/auth_db"
      AUTH_JWT_SECRET: "${AUTH_JWT_SECRET:-local-development-only-jwt-secret-change-before-production}"
      AUTH_STUDENT_BASE_URL: http://student:3002
      AUTH_STUDENT_TIMEOUT_MS: "${AUTH_STUDENT_TIMEOUT_MS:-3000}"
      AUTH_BOOTSTRAP_ADMIN_ID: "${AUTH_BOOTSTRAP_ADMIN_ID:-00000000-0000-4000-8000-000000000001}"
      AUTH_BOOTSTRAP_ADMIN_EMAIL: "${AUTH_BOOTSTRAP_ADMIN_EMAIL:-admin@example.test}"
      AUTH_BOOTSTRAP_ADMIN_PASSWORD: "${AUTH_BOOTSTRAP_ADMIN_PASSWORD:-example-password}"
      AUTH_BOOTSTRAP_INSTRUCTOR_ID: "${AUTH_BOOTSTRAP_INSTRUCTOR_ID:-22222222-2222-4222-8222-222222222222}"
      AUTH_BOOTSTRAP_INSTRUCTOR_EMAIL: "${AUTH_BOOTSTRAP_INSTRUCTOR_EMAIL:-instructor@example.test}"
      AUTH_BOOTSTRAP_INSTRUCTOR_PASSWORD: "${AUTH_BOOTSTRAP_INSTRUCTOR_PASSWORD:-example-password}"
      AUTH_BOOTSTRAP_STUDENT_ID: "${AUTH_BOOTSTRAP_STUDENT_ID:-11111111-1111-4111-8111-111111111111}"
      AUTH_BOOTSTRAP_STUDENT_EMAIL: "${AUTH_BOOTSTRAP_STUDENT_EMAIL:-student@example.test}"
      AUTH_BOOTSTRAP_STUDENT_PASSWORD: "${AUTH_BOOTSTRAP_STUDENT_PASSWORD:-example-password}"
      AUTH_JWT_TTL_SECONDS: "${AUTH_JWT_TTL_SECONDS:-3600}"
      AUTH_REFRESH_TTL_SECONDS: "${AUTH_REFRESH_TTL_SECONDS:-86400}"
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: "${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:-http://otel-collector:4318/v1/traces}"
      OTEL_EXPORTER_OTLP_METRICS_ENDPOINT: "${OTEL_EXPORTER_OTLP_METRICS_ENDPOINT:-http://otel-collector:4318/v1/metrics}"
      OTEL_EXPORTER_OTLP_LOGS_ENDPOINT: "${OTEL_EXPORTER_OTLP_LOGS_ENDPOINT:-http://otel-collector:4318/v1/logs}"
      OTEL_METRIC_EXPORT_INTERVAL: "${OTEL_METRIC_EXPORT_INTERVAL:-5000}"
      HTTP_ACCESS_LOG_ENABLED: "${HTTP_ACCESS_LOG_ENABLED:-true}"
      OTEL_SDK_DISABLED: "${OTEL_SDK_DISABLED:-false}"
      OTEL_SERVICE_INSTANCE_ID: "${AUTH_SERVICE_INSTANCE_ID:-auth-compose-1}"
      OTEL_SERVICE_VERSION: "${AUTH_SERVICE_VERSION:-0.1.0}"
      PORT: 3001
    ports:
      - "${AUTH_PORT:-3001}:3001"
    depends_on:
      postgres:
        condition: service_healthy
      student:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:3001/ready')
          .then((response) => { if (!response.ok) process.exit(1); })
          .catch(() => process.exit(1));
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    networks:
      - lms-network
      - aiops-net

  course:
    build:
      context: ../lms
      dockerfile: services/course/Dockerfile
    environment:
      NODE_ENV: production
      COURSE_DATABASE_URL: "postgresql://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/course_db"
      COURSE_REDIS_URL: redis://redis:6379
      COURSE_CACHE_TTL_SECONDS: "${COURSE_CACHE_TTL_SECONDS:-60}"
      COURSE_CACHE_TIMEOUT_MS: "${COURSE_CACHE_TIMEOUT_MS:-300}"
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: "${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:-http://otel-collector:4318/v1/traces}"
      OTEL_EXPORTER_OTLP_METRICS_ENDPOINT: "${OTEL_EXPORTER_OTLP_METRICS_ENDPOINT:-http://otel-collector:4318/v1/metrics}"
      OTEL_EXPORTER_OTLP_LOGS_ENDPOINT: "${OTEL_EXPORTER_OTLP_LOGS_ENDPOINT:-http://otel-collector:4318/v1/logs}"
      OTEL_METRIC_EXPORT_INTERVAL: "${OTEL_METRIC_EXPORT_INTERVAL:-5000}"
      HTTP_ACCESS_LOG_ENABLED: "${HTTP_ACCESS_LOG_ENABLED:-true}"
      OTEL_SDK_DISABLED: "${OTEL_SDK_DISABLED:-false}"
      OTEL_SERVICE_INSTANCE_ID: "${COURSE_SERVICE_INSTANCE_ID:-course-compose-1}"
      OTEL_SERVICE_VERSION: "${COURSE_SERVICE_VERSION:-0.1.0}"
      PORT: 3002
    ports:
      - "${COURSE_PORT:-3002}:3002"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:3002/health')
          .then((response) => { if (!response.ok) process.exit(1); })
          .catch(() => process.exit(1));
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    networks:
      - lms-network
      - aiops-net

  enrollment:
    build:
      context: ../lms
      dockerfile: services/enrollment/Dockerfile
    environment:
      NODE_ENV: production
      ENROLLMENT_DATABASE_URL: "postgresql://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/enrollment_db"
      ENROLLMENT_COURSE_BASE_URL: http://course:3002
      ENROLLMENT_COURSE_TIMEOUT_MS: "${ENROLLMENT_COURSE_TIMEOUT_MS:-3000}"
      ENROLLMENT_COURSE_BREAKER_THRESHOLD: "${ENROLLMENT_COURSE_BREAKER_THRESHOLD:-3}"
      ENROLLMENT_COURSE_BREAKER_COOLDOWN_MS: "${ENROLLMENT_COURSE_BREAKER_COOLDOWN_MS:-5000}"
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: "${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:-http://otel-collector:4318/v1/traces}"
      OTEL_EXPORTER_OTLP_METRICS_ENDPOINT: "${OTEL_EXPORTER_OTLP_METRICS_ENDPOINT:-http://otel-collector:4318/v1/metrics}"
      OTEL_EXPORTER_OTLP_LOGS_ENDPOINT: "${OTEL_EXPORTER_OTLP_LOGS_ENDPOINT:-http://otel-collector:4318/v1/logs}"
      OTEL_METRIC_EXPORT_INTERVAL: "${OTEL_METRIC_EXPORT_INTERVAL:-5000}"
      HTTP_ACCESS_LOG_ENABLED: "${HTTP_ACCESS_LOG_ENABLED:-true}"
      OTEL_SDK_DISABLED: "${OTEL_SDK_DISABLED:-false}"
      OTEL_SERVICE_INSTANCE_ID: "${ENROLLMENT_SERVICE_INSTANCE_ID:-enrollment-compose-1}"
      OTEL_SERVICE_VERSION: "${ENROLLMENT_SERVICE_VERSION:-0.1.0}"
      PORT: 3003
    ports:
      - "${ENROLLMENT_PORT:-3003}:3003"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:3003/health')
          .then((response) => { if (!response.ok) process.exit(1); })
          .catch(() => process.exit(1));
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    networks:
      - lms-network
      - aiops-net

  submission:
    build:
      context: ../lms
      dockerfile: services/submission/Dockerfile
    environment:
      NODE_ENV: production
      SUBMISSION_DATABASE_URL: "postgresql://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/submission_db"
      SUBMISSION_COURSE_BASE_URL: http://course:3002
      SUBMISSION_ENROLLMENT_BASE_URL: http://enrollment:3003
      SUBMISSION_STORAGE_BASE_URL: http://submission-storage-mock:3005
      SUBMISSION_DEPENDENCY_TIMEOUT_MS: "${SUBMISSION_DEPENDENCY_TIMEOUT_MS:-3000}"
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: "${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:-http://otel-collector:4318/v1/traces}"
      OTEL_EXPORTER_OTLP_METRICS_ENDPOINT: "${OTEL_EXPORTER_OTLP_METRICS_ENDPOINT:-http://otel-collector:4318/v1/metrics}"
      OTEL_EXPORTER_OTLP_LOGS_ENDPOINT: "${OTEL_EXPORTER_OTLP_LOGS_ENDPOINT:-http://otel-collector:4318/v1/logs}"
      OTEL_METRIC_EXPORT_INTERVAL: "${OTEL_METRIC_EXPORT_INTERVAL:-5000}"
      HTTP_ACCESS_LOG_ENABLED: "${HTTP_ACCESS_LOG_ENABLED:-true}"
      OTEL_SDK_DISABLED: "${OTEL_SDK_DISABLED:-false}"
      OTEL_SERVICE_INSTANCE_ID: "${SUBMISSION_SERVICE_INSTANCE_ID:-submission-compose-1}"
      OTEL_SERVICE_VERSION: "${SUBMISSION_SERVICE_VERSION:-0.1.0}"
      PORT: 3004
    ports:
      - "${SUBMISSION_PORT:-3004}:3004"
    depends_on:
      postgres:
        condition: service_healthy
      course:
        condition: service_healthy
      enrollment:
        condition: service_healthy
      submission-storage-mock:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:3004/health')
          .then((response) => { if (!response.ok) process.exit(1); })
          .catch(() => process.exit(1));
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    networks:
      - lms-network
      - aiops-net

  notification:
    build:
      context: ../lms
      dockerfile: services/notification/Dockerfile
    environment:
      NODE_ENV: production
      NOTIFICATION_RABBITMQ_URL: "amqp://${RABBITMQ_DEFAULT_USER:-lms}:${RABBITMQ_DEFAULT_PASS:-lms-local-only}@rabbitmq:5672"
      NOTIFICATION_GRADE_COMPLETED_EXCHANGE: "${NOTIFICATION_GRADE_COMPLETED_EXCHANGE:-lms.events}"
      NOTIFICATION_GRADE_COMPLETED_QUEUE: "${NOTIFICATION_GRADE_COMPLETED_QUEUE:-notification.grade-completed.v1}"
      NOTIFICATION_CONSUMER_PREFETCH: "${NOTIFICATION_CONSUMER_PREFETCH:-1}"
      NOTIFICATION_RECONNECT_DELAY_MS: "${NOTIFICATION_RECONNECT_DELAY_MS:-1000}"
      NOTIFICATION_DEDUP_TTL_SECONDS: "${NOTIFICATION_DEDUP_TTL_SECONDS:-86400}"
      NOTIFICATION_DEDUP_MAX_EVENT_IDS: "${NOTIFICATION_DEDUP_MAX_EVENT_IDS:-10000}"
      NOTIFICATION_CONSUMER_SLOWDOWN_ENABLED: "${NOTIFICATION_CONSUMER_SLOWDOWN_ENABLED:-false}"
      NOTIFICATION_CONSUMER_SLOWDOWN_MS: "${NOTIFICATION_CONSUMER_SLOWDOWN_MS:-0}"
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: "${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:-http://otel-collector:4318/v1/traces}"
      OTEL_EXPORTER_OTLP_METRICS_ENDPOINT: "${OTEL_EXPORTER_OTLP_METRICS_ENDPOINT:-http://otel-collector:4318/v1/metrics}"
      OTEL_EXPORTER_OTLP_LOGS_ENDPOINT: "${OTEL_EXPORTER_OTLP_LOGS_ENDPOINT:-http://otel-collector:4318/v1/logs}"
      OTEL_METRIC_EXPORT_INTERVAL: "${OTEL_METRIC_EXPORT_INTERVAL:-5000}"
      HTTP_ACCESS_LOG_ENABLED: "${HTTP_ACCESS_LOG_ENABLED:-true}"
      OTEL_SDK_DISABLED: "${OTEL_SDK_DISABLED:-false}"
      OTEL_SERVICE_INSTANCE_ID: "${NOTIFICATION_SERVICE_INSTANCE_ID:-notification-compose-1}"
      OTEL_SERVICE_VERSION: "${NOTIFICATION_SERVICE_VERSION:-0.1.0}"
      PORT: 3006
    ports:
      - "${NOTIFICATION_PORT:-3006}:3006"
    depends_on:
      rabbitmq:
        condition: service_started
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:3006/health')
          .then((response) => { if (!response.ok) process.exit(1); })
          .catch(() => process.exit(1));
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    networks:
      - lms-network
      - aiops-net

  grading:
    build:
      context: ../lms
      dockerfile: services/grading/Dockerfile
    environment:
      NODE_ENV: production
      GRADING_DATABASE_URL: "postgresql://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/grading_db"
      GRADING_SUBMISSION_BASE_URL: http://submission:3004
      GRADING_DEPENDENCY_TIMEOUT_MS: "${GRADING_DEPENDENCY_TIMEOUT_MS:-3000}"
      GRADING_RABBITMQ_URL: "amqp://${RABBITMQ_DEFAULT_USER:-lms}:${RABBITMQ_DEFAULT_PASS:-lms-local-only}@rabbitmq:5672"
      GRADING_GRADE_COMPLETED_EXCHANGE: "${GRADING_GRADE_COMPLETED_EXCHANGE:-lms.events}"
      GRADING_PUBLISH_CONFIRM_TIMEOUT_MS: "${GRADING_PUBLISH_CONFIRM_TIMEOUT_MS:-3000}"
      GRADING_EVENT_RETRY_INTERVAL_MS: "${GRADING_EVENT_RETRY_INTERVAL_MS:-5000}"
      GRADING_EVENT_RETRY_BATCH_SIZE: "${GRADING_EVENT_RETRY_BATCH_SIZE:-20}"
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: "${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:-http://otel-collector:4318/v1/traces}"
      OTEL_EXPORTER_OTLP_METRICS_ENDPOINT: "${OTEL_EXPORTER_OTLP_METRICS_ENDPOINT:-http://otel-collector:4318/v1/metrics}"
      OTEL_EXPORTER_OTLP_LOGS_ENDPOINT: "${OTEL_EXPORTER_OTLP_LOGS_ENDPOINT:-http://otel-collector:4318/v1/logs}"
      OTEL_METRIC_EXPORT_INTERVAL: "${OTEL_METRIC_EXPORT_INTERVAL:-5000}"
      HTTP_ACCESS_LOG_ENABLED: "${HTTP_ACCESS_LOG_ENABLED:-true}"
      OTEL_SDK_DISABLED: "${OTEL_SDK_DISABLED:-false}"
      OTEL_SERVICE_INSTANCE_ID: "${GRADING_SERVICE_INSTANCE_ID:-grading-compose-1}"
      OTEL_SERVICE_VERSION: "${GRADING_SERVICE_VERSION:-0.1.0}"
      PORT: 3007
    ports:
      - "${GRADING_PORT:-3007}:3007"
    depends_on:
      postgres:
        condition: service_healthy
      submission:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:3007/health')
          .then((response) => { if (!response.ok) process.exit(1); })
          .catch(() => process.exit(1));
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    networks:
      - lms-network
      - aiops-net

  submission-storage-mock:
    build:
      context: ../lms
      dockerfile: services/submission-storage-mock/Dockerfile
    environment:
      NODE_ENV: production
      STORAGE_MOCK_DEFAULT_LATENCY_MS: "${STORAGE_MOCK_DEFAULT_LATENCY_MS:-0}"
      STORAGE_MOCK_DEFAULT_ERROR_MODE: "${STORAGE_MOCK_DEFAULT_ERROR_MODE:-none}"
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: "${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:-http://otel-collector:4318/v1/traces}"
      OTEL_EXPORTER_OTLP_METRICS_ENDPOINT: "${OTEL_EXPORTER_OTLP_METRICS_ENDPOINT:-http://otel-collector:4318/v1/metrics}"
      OTEL_EXPORTER_OTLP_LOGS_ENDPOINT: "${OTEL_EXPORTER_OTLP_LOGS_ENDPOINT:-http://otel-collector:4318/v1/logs}"
      OTEL_METRIC_EXPORT_INTERVAL: "${OTEL_METRIC_EXPORT_INTERVAL:-5000}"
      HTTP_ACCESS_LOG_ENABLED: "${HTTP_ACCESS_LOG_ENABLED:-true}"
      OTEL_SDK_DISABLED: "${OTEL_SDK_DISABLED:-false}"
      OTEL_SERVICE_INSTANCE_ID: "${STORAGE_MOCK_SERVICE_INSTANCE_ID:-submission-storage-compose-1}"
      OTEL_SERVICE_VERSION: "${STORAGE_MOCK_SERVICE_VERSION:-0.1.0}"
      PORT: 3005
    ports:
      - "${STORAGE_MOCK_PORT:-3005}:3005"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:3005/health')
          .then((response) => { if (!response.ok) process.exit(1); })
          .catch(() => process.exit(1));
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    networks:
      - lms-network
      - aiops-net

  student:
    build:
      context: ../lms
      dockerfile: services/student/Dockerfile
    environment:
      NODE_ENV: production
      STUDENT_DATABASE_URL: "postgresql://${STUDENT_POSTGRES_USER:-student_user}:${STUDENT_POSTGRES_PASSWORD:-student-local-only}@postgres:5432/student_db"
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: "${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:-http://otel-collector:4318/v1/traces}"
      OTEL_EXPORTER_OTLP_METRICS_ENDPOINT: "${OTEL_EXPORTER_OTLP_METRICS_ENDPOINT:-http://otel-collector:4318/v1/metrics}"
      OTEL_EXPORTER_OTLP_LOGS_ENDPOINT: "${OTEL_EXPORTER_OTLP_LOGS_ENDPOINT:-http://otel-collector:4318/v1/logs}"
      OTEL_METRIC_EXPORT_INTERVAL: "${OTEL_METRIC_EXPORT_INTERVAL:-5000}"
      HTTP_ACCESS_LOG_ENABLED: "${HTTP_ACCESS_LOG_ENABLED:-true}"
      OTEL_SDK_DISABLED: "${OTEL_SDK_DISABLED:-false}"
      OTEL_SERVICE_INSTANCE_ID: "${STUDENT_SERVICE_INSTANCE_ID:-student-compose-1}"
      OTEL_SERVICE_VERSION: "${STUDENT_SERVICE_VERSION:-0.1.0}"
      PORT: 3002
    ports:
      - "${STUDENT_PORT:-3012}:3002"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:3002/ready')
          .then((response) => { if (!response.ok) process.exit(1); })
          .catch(() => process.exit(1));
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    networks:
      - lms-network
      - aiops-net

  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-course_db}"
      POSTGRES_USER: "${POSTGRES_USER:-lms}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-lms-local-only}"
      AUTH_POSTGRES_USER: "${AUTH_POSTGRES_USER:?AUTH_POSTGRES_USER is required}"
      AUTH_POSTGRES_PASSWORD: "${AUTH_POSTGRES_PASSWORD:?AUTH_POSTGRES_PASSWORD is required}"
      STUDENT_POSTGRES_USER: "${STUDENT_POSTGRES_USER:-student_user}"
      STUDENT_POSTGRES_PASSWORD: "${STUDENT_POSTGRES_PASSWORD:-student-local-only}"
      MEDIA_POSTGRES_USER: "${MEDIA_POSTGRES_USER:-media_user}"
      MEDIA_POSTGRES_PASSWORD: "${MEDIA_POSTGRES_PASSWORD:-media-local-only}"
      NOTIFICATION_POSTGRES_USER: "${NOTIFICATION_POSTGRES_USER:-notification_user}"
      NOTIFICATION_POSTGRES_PASSWORD: "${NOTIFICATION_POSTGRES_PASSWORD:-notification-local-only}"
      SCHEDULER_POSTGRES_USER: "${SCHEDULER_POSTGRES_USER:-scheduler_user}"
      SCHEDULER_POSTGRES_PASSWORD: "${SCHEDULER_POSTGRES_PASSWORD:-scheduler-local-only}"
      AI_POSTGRES_USER: "${AI_POSTGRES_USER:-ai_user}"
      AI_POSTGRES_PASSWORD: "${AI_POSTGRES_PASSWORD:-ai-local-only}"
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - lms-network

  redis:
    image: redis:8.2.1-alpine
    command:
      - redis-server
      - --appendonly
      - "yes"
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    networks:
      - lms-network

  # MinIO ngừng phát hành image cộng đồng nên dùng bản bitnamilegacy đã ghim phiên bản (2025.7.23).
  # Đủ cho testbed; thay bằng image tự build/registry nội bộ nếu cần bản vá bảo mật mới.
  minio:
    image: bitnamilegacy/minio:2025.7.23-debian-12-r5
    environment:
      MINIO_DEFAULT_BUCKETS: ""
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:-lms-minio}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:-lms-minio-local-only}"
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/bitnami/minio/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    networks:
      - lms-network
      - aiops-net

  # Tạo bucket do service `media` sở hữu rồi nằm chờ; service khác không truy cập MinIO.
  minio-init:
    image: bitnamilegacy/minio-client:2025.7.21-debian-12-r3
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:-lms-minio}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:-lms-minio-local-only}"
    entrypoint:
      - /bin/sh
      - -c
      - >-
        until mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"; do sleep 2; done &&
        for bucket in images videos documents audios other; do mc mb --ignore-existing "local/$$bucket"; done &&
        touch /tmp/buckets-ready && exec tail -f /dev/null
    # Giữ container chạy sau khi tạo bucket: `up --wait` coi container đã thoát là lỗi, và service
    # phụ thuộc có thể chờ `service_healthy` thay vì `service_completed_successfully`.
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/buckets-ready"]
      interval: 3s
      timeout: 2s
      retries: 20
    networks:
      - lms-network

  mailpit:
    image: axllent/mailpit:v1.31.6
    environment:
      MP_MAX_MESSAGES: 5000
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks:
      - lms-network

  rabbitmq:
    image: rabbitmq:4.1.4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: "${RABBITMQ_DEFAULT_USER:-lms}"
      RABBITMQ_DEFAULT_PASS: "${RABBITMQ_DEFAULT_PASS:-lms-local-only}"
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test:
        - CMD
        - rabbitmq-diagnostics
        - -q
        - ping
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - lms-network
      - aiops-net

networks:
  lms-network:
    driver: bridge
  # Network nối với aiops-platform/observability; định nghĩa giống hệt file compose bên đó.
  aiops-net:
    name: "${AIOPS_NETWORK_NAME:-aiops-net}"
    driver: bridge

volumes:
  minio-data:
  postgres-data:
  redis-data:
  rabbitmq-data:
