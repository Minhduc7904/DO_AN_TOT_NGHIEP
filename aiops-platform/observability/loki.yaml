auth_enabled: false
server:
  http_listen_port: 3100
common:
  path_prefix: /var/observability
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory
  storage:
    filesystem:
      chunks_directory: /var/observability/chunks
      rules_directory: /var/observability/rules
schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h
compactor:
  working_directory: /var/observability/compactor
  retention_enabled: true
  delete_request_store: filesystem
limits_config:
  retention_period: 24h
  allow_structured_metadata: true
  otlp_config:
    resource_attributes:
      ignore_defaults: true
      attributes_config:
        - action: index_label
          attributes: [service.name]
        - action: structured_metadata
          attributes: [service.version, service.instance.id]
