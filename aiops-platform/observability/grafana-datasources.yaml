apiVersion: 1
datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: 5s
  - name: Tempo
    uid: tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    editable: false
    jsonData:
      # Trace → log: trace_id là structured metadata của Loki, không nằm trong dòng log, nên dùng
      # label filter thay vì line filter mặc định. `__tags` ánh xạ service.name sang label service_name.
      # `$$` giữ nguyên biến Grafana vì provisioning tự thay `${...}` bằng biến môi trường.
      tracesToLogsV2:
        datasourceUid: loki
        spanStartTimeShift: -5m
        spanEndTimeShift: 5m
        tags:
          - key: service.name
            value: service_name
        customQuery: true
        query: '{$${__tags}} | trace_id="$${__trace.traceId}"'
      nodeGraph:
        enabled: true
      lokiSearch:
        datasourceUid: loki
  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: false
    jsonData:
      # Log → trace theo structured metadata trace_id.
      derivedFields:
        - name: trace_id
          matcherType: label
          matcherRegex: trace_id
          datasourceUid: tempo
          url: "$${__value.raw}"
          urlDisplayLabel: Xem trace
