receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
  # Metric hàng đợi của broker dùng chung. Queue canonical `<worker>--<command>-v<n>` (và `.error`) thuộc
  # worker tiêu thụ: `service.name` và `dependency_identity` suy ra từ tiền tố trước `--`.
  prometheus/rabbitmq:
    config:
      scrape_configs:
        - job_name: rabbitmq-queues
          scrape_interval: 5s
          metrics_path: /metrics/detailed
          params:
            family: [queue_coarse_metrics, queue_consumer_count]
            vhost: ["/"]
          static_configs:
            - targets: [rabbitmq:15692]
          metric_relabel_configs:
            - source_labels: [__name__]
              regex: rabbitmq_detailed_queue_(messages(_ready|_unacked)?|consumers)
              action: keep
            - source_labels: [queue]
              regex: "((?:media|notification|ai)-worker)--.+"
              action: keep
            - source_labels: [queue]
              regex: "((?:media|notification|ai)-worker)--.+"
              target_label: lms_queue_owner
              replacement: "$1"
            - regex: vhost
              action: labeldrop

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 192
    spike_limit_mib: 48
  batch:
    timeout: 1s
    send_batch_size: 512
    send_batch_max_size: 1024
  # Prometheus receiver tự sinh up/scrape_* cho target broker; bỏ để chúng không mang service.name của
  # runtime nào như tín hiệu sức khỏe. Thiếu gauge queue vẫn được hiểu là unavailable.
  filter/rabbitmq:
    error_mode: ignore
    metrics:
      metric:
        - 'not IsMatch(name, "^rabbitmq_detailed_queue_(messages(_ready|_unacked)?|consumers)$")'
  transform/rabbitmq:
    metric_statements:
      - context: datapoint
        statements:
          - set(attributes["service.name"], attributes["lms_queue_owner"])
          - set(attributes["dependency_identity"], Concat([attributes["lms_queue_owner"], "rabbitmq"], "-"))
          - delete_key(attributes, "lms_queue_owner")
  # Tách datapoint thành một resource cho mỗi worker để Prometheus nhận `service_name` đúng.
  groupbyattrs/rabbitmq:
    keys: [service.name]
  resource/rabbitmq:
    attributes:
      # Broker exporter không có version/instance của runtime LMS; để trống thay vì gán giá trị giả.
      - key: service.version
        action: delete
      - key: service.instance.id
        action: delete

exporters:
  otlp_http/tempo:
    endpoint: http://tempo:4318
    retry_on_failure:
      initial_interval: 1s
      max_interval: 5s
      max_elapsed_time: 30s
    sending_queue:
      queue_size: 256
      num_consumers: 2
  prometheus:
    endpoint: 0.0.0.0:8889
    resource_constant_labels:
      included:
        - service.name
        - service.version
        - service.instance.id
  otlp_http/loki:
    endpoint: http://loki:3100/otlp
    retry_on_failure:
      initial_interval: 1s
      max_interval: 5s
      max_elapsed_time: 30s
    sending_queue:
      queue_size: 256
      num_consumers: 2

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp_http/tempo]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [prometheus]
    metrics/rabbitmq:
      receivers: [prometheus/rabbitmq]
      processors: [memory_limiter, filter/rabbitmq, transform/rabbitmq, groupbyattrs/rabbitmq, resource/rabbitmq, batch]
      exporters: [prometheus]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp_http/loki]
