[project]
name = "aiops-training"
version = "0.1.0"
description = "RCA engine của đề tài: export telemetry, feature, detector, RCA và đánh giá"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.28,<0.29",
    "pyarrow>=21,<22",
    "scikit-learn>=1.7,<1.8",
]

[project.scripts]
aiops-training = "aiops_training.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.4,<9",
    "ruff>=0.13,<0.14",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aiops_training"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
