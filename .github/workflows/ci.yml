name: CI baseline

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    name: Clean install, quality gates and telemetry assertion
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lms
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_DB: auth_db
          POSTGRES_USER: w1_test
          POSTGRES_PASSWORD: w1_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U w1_test -d auth_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:8.2.1-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      W1_AUTH_DATABASE_URL: postgresql://w1_test:w1_test_password@127.0.0.1:5432/auth_db
      W2_REDIS_URL: redis://127.0.0.1:6379
    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.13.1

      - name: Verify pinned toolchain
        run: |
          node --version
          pnpm --version

      - name: Clean install
        run: pnpm install --frozen-lockfile

      - name: Run quality gates
        run: |
          export COURSE_DATABASE_URL="${W1_AUTH_DATABASE_URL%/auth_db}/course_db"
          export ENROLLMENT_DATABASE_URL="${W1_AUTH_DATABASE_URL%/auth_db}/enrollment_db"
          export SUBMISSION_DATABASE_URL="${W1_AUTH_DATABASE_URL%/auth_db}/submission_db"
          export GRADING_DATABASE_URL="${W1_AUTH_DATABASE_URL%/auth_db}/grading_db"
          pnpm run test:w1:postgres && pnpm run test:course:postgres && pnpm run test:enrollment:postgres && pnpm run test:submission:postgres && pnpm run test:grading:postgres && pnpm run test:w2:postgres && pnpm run test:w3:postgres && pnpm run test:w5:postgres && pnpm run ci:verify

  compose-config:
    name: Validate Compose without local configuration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Ensure local Compose configuration is absent
        run: test ! -e docker-compose/.env

      - name: Validate Compose with committed example configuration
        run: docker compose --env-file docker-compose/.env.example -f docker-compose/compose.yaml config --quiet

  w7-compose:
    name: Fresh Compose W1–W7 smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@v6
      - name: Start clean LMS stack
        run: docker compose --env-file docker-compose/.env.example -f docker-compose/compose.yaml up --build -d --wait
      - name: Login, enroll and submit through Gateway
        run: |
          login="$(curl --fail --silent --show-error -H 'content-type: application/json' -d '{"email":"student@example.test","password":"example-password"}' http://127.0.0.1:3000/api/v1/auth/login)"
          token="$(printf '%s' "$login" | node -e 'let text="";process.stdin.on("data",chunk=>text+=chunk);process.stdin.on("end",()=>process.stdout.write(JSON.parse(text).access_token))')"
          curl --fail --silent --show-error -H "Authorization: Bearer $token" http://127.0.0.1:3000/api/v1/courses/course-001 | node -e 'let text="";process.stdin.on("data",chunk=>text+=chunk);process.stdin.on("end",()=>{if(JSON.parse(text).id!=="course-001")process.exit(1)})'
          curl --fail --silent --show-error -H "Authorization: Bearer $token" -H 'content-type: application/json' -d '{"course_id":"course-001"}' http://127.0.0.1:3000/api/v1/enrollments | node -e 'let text="";process.stdin.on("data",chunk=>text+=chunk);process.stdin.on("end",()=>{if(JSON.parse(text).course_id!=="course-001")process.exit(1)})'
          submission="$(curl --fail --silent --show-error -H "Authorization: Bearer $token" -H 'content-type: application/json' -d '{"course_id":"course-001","content":"compose-e2e-answer"}' http://127.0.0.1:3000/api/v1/submissions)"
          submission_id="$(printf '%s' "$submission" | node -e 'let text="";process.stdin.on("data",chunk=>text+=chunk);process.stdin.on("end",()=>process.stdout.write(JSON.parse(text).id))')"
          test -n "$submission_id"
          curl --fail --silent --show-error -H "Authorization: Bearer $token" "http://127.0.0.1:3000/api/v1/submissions/$submission_id" | node -e 'let text="";process.stdin.on("data",chunk=>text+=chunk);process.stdin.on("end",()=>{if(JSON.parse(text).id!==process.argv[1])process.exit(1)})' "$submission_id"
      - name: Instructor grades a Submission through Gateway
        run: |
          json_field() { node -e 'let text="";process.stdin.on("data",chunk=>text+=chunk);process.stdin.on("end",()=>process.stdout.write(String(JSON.parse(text)[process.argv[1]])))' "$1"; }
          login() { curl --fail --silent --show-error -H 'content-type: application/json' -d "{\"email\":\"$1\",\"password\":\"example-password\"}" http://127.0.0.1:3000/api/v1/auth/login | json_field access_token; }
          student_token="$(login student@example.test)"
          instructor_token="$(login instructor@example.test)"
          submission_id="$(curl --fail --silent --show-error -H "Authorization: Bearer $student_token" -H 'content-type: application/json' -d '{"course_id":"course-001","content":"compose-grading-answer"}' http://127.0.0.1:3000/api/v1/submissions | json_field id)"
          test -n "$submission_id"
          grade_body="{\"submission_id\":\"$submission_id\",\"score\":92.5}"
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' -H "Authorization: Bearer $student_token" -H 'content-type: application/json' -d "$grade_body" http://127.0.0.1:3000/api/v1/grades)" = 403
          grade="$(curl --fail --silent --show-error -H "Authorization: Bearer $instructor_token" -H 'content-type: application/json' -d "$grade_body" http://127.0.0.1:3000/api/v1/grades)"
          grade_id="$(printf '%s' "$grade" | json_field id)"
          test -n "$grade_id"
          test "$(curl --fail --silent --show-error -H "Authorization: Bearer $student_token" "http://127.0.0.1:3000/api/v1/grades/$grade_id" | json_field submission_id)" = "$submission_id"
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' -H "Authorization: Bearer $instructor_token" -H 'content-type: application/json' -d "$grade_body" http://127.0.0.1:3000/api/v1/grades)" = 409
      - name: Show logs on failure
        if: failure()
        run: docker compose --env-file docker-compose/.env.example -f docker-compose/compose.yaml logs --no-color
      - name: Stop stack
        if: always()
        run: docker compose --env-file docker-compose/.env.example -f docker-compose/compose.yaml down --volumes --remove-orphans
