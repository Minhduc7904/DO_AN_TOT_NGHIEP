name: CI baseline

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    name: Clean install, quality gates and telemetry assertion
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lms
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_DB: auth_db
          POSTGRES_USER: w1_test
          POSTGRES_PASSWORD: w1_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U w1_test -d auth_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      rabbitmq:
        image: rabbitmq:4.1.4-management-alpine
        env:
          RABBITMQ_DEFAULT_USER: w1_test
          RABBITMQ_DEFAULT_PASS: w1_test_password
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
          --health-start-period 20s
      minio:
        image: bitnamilegacy/minio:2025.7.23-debian-12-r5
        env:
          MINIO_ROOT_USER: lms-minio
          MINIO_ROOT_PASSWORD: lms-minio-local-only
          MINIO_DEFAULT_BUCKETS: images,videos,documents,audios,other
        ports:
          - 9000:9000
        options: >-
          --health-cmd "curl -fsS http://127.0.0.1:9000/minio/health/live"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
          --health-start-period 5s
      mailpit:
        image: axllent/mailpit:v1.31.6
        ports:
          - 1025:1025
          - 8025:8025
        options: >-
          --health-cmd "/mailpit readyz"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      W1_AUTH_DATABASE_URL: postgresql://w1_test:w1_test_password@127.0.0.1:5432/auth_db
      NOTIFICATION_RABBITMQ_URL: amqp://w1_test:w1_test_password@127.0.0.1:5672
      NOTIFICATION_SMTP_HOST: 127.0.0.1
      NOTIFICATION_SMTP_PORT: 1025
      MAILPIT_API_PORT: 8025
      MEDIA_RABBITMQ_URL: amqp://w1_test:w1_test_password@127.0.0.1:5672
      MINIO_ENDPOINT: 127.0.0.1
      MINIO_PORT: 9000
    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.13.1

      - name: Verify pinned toolchain
        run: |
          node --version
          pnpm --version

      - name: Clean install
        run: pnpm install --frozen-lockfile

      - name: Create service databases
        run: |
          for database in student_db course_db media_db notification_db; do
            PGPASSWORD=w1_test_password psql -h 127.0.0.1 -U w1_test -d auth_db -c "CREATE DATABASE $database"
          done

      - name: Run quality gates
        run: |
          base="${W1_AUTH_DATABASE_URL%/auth_db}"
          export AUTH_DATABASE_URL="$W1_AUTH_DATABASE_URL"
          export STUDENT_DATABASE_URL="$base/student_db"
          export COURSE_DATABASE_URL="$base/course_db"
          export MEDIA_DATABASE_URL="$base/media_db"
          export NOTIFICATION_DATABASE_URL="$base/notification_db"
          pnpm run build
          (cd services/auth && pnpm exec prisma migrate deploy)
          (cd services/student && pnpm exec prisma migrate deploy)
          (cd services/course && pnpm exec prisma migrate deploy)
          (cd services/media && pnpm exec prisma migrate deploy)
          (cd services/notification && pnpm exec prisma migrate deploy)
          pnpm run test:auth:e2e && pnpm run test:student:e2e && pnpm run test:course:e2e && pnpm run test:media:e2e && pnpm run test:notification:e2e && pnpm run ci:verify

  compose-config:
    name: Validate Compose without local configuration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Ensure local Compose configuration is absent
        run: test ! -e docker-compose/.env

      - name: Validate LMS Compose with committed example configuration
        run: docker compose --env-file docker-compose/.env.example -f docker-compose/compose.yaml config --quiet

      - name: Validate aiops-platform observability Compose with committed example configuration
        run: docker compose --env-file aiops-platform/observability/.env.example -f aiops-platform/observability/compose.yaml config --quiet

      - name: Validate full stack Compose (LMS + aiops-platform)
        run: docker compose --env-file docker-compose/.env.example -f docker-compose/compose.full.yaml config --quiet

  testbed-reset:
    name: Reset/seed Testbed twice with stable fingerprint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v6
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false
      - name: Run reset guard tests
        run: pnpm --dir lms run test:testbed:reset
      - name: Reset twice and compare fingerprint
        run: pnpm --dir lms run test:testbed:reset:compose

  # `mvp-regression` và `w7-compose` gắn với luồng v1 (enrollment/submission/grading) đã bị gỡ ở R-05;
  # bản viết lại cho topology v2 nằm ở R-11 (regression, Postman) và R-12 (smoke telemetry).
