name: CI

# Luồng nhanh chạy trên mọi PR và mỗi lần merge vào main. Regression và Postman (dựng cả stack
# compose, 10–25 phút) nằm ở regression.yml.
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PGUSER: lms_test
  PGPASSWORD: lms_test_password
  AUTH_DATABASE_URL: postgresql://lms_test:lms_test_password@127.0.0.1:5432/auth_db
  STUDENT_DATABASE_URL: postgresql://lms_test:lms_test_password@127.0.0.1:5432/student_db
  COURSE_DATABASE_URL: postgresql://lms_test:lms_test_password@127.0.0.1:5432/course_db
  MEDIA_DATABASE_URL: postgresql://lms_test:lms_test_password@127.0.0.1:5432/media_db
  NOTIFICATION_DATABASE_URL: postgresql://lms_test:lms_test_password@127.0.0.1:5432/notification_db
  AI_DATABASE_URL: postgresql://lms_test:lms_test_password@127.0.0.1:5432/ai_db
  SCHEDULER_DATABASE_URL: postgresql://lms_test:lms_test_password@127.0.0.1:5432/scheduler_db
  NOTIFICATION_RABBITMQ_URL: amqp://lms_test:lms_test_password@127.0.0.1:5672
  MEDIA_RABBITMQ_URL: amqp://lms_test:lms_test_password@127.0.0.1:5672
  AI_RABBITMQ_URL: amqp://lms_test:lms_test_password@127.0.0.1:5672
  NOTIFICATION_SMTP_HOST: 127.0.0.1
  NOTIFICATION_SMTP_PORT: 1025
  MAILPIT_API_PORT: 8025
  MINIO_ENDPOINT: 127.0.0.1
  MINIO_PORT: 9000

jobs:
  static:
    name: Format, lint và build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: lms
    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Set up toolchain
        uses: ./.github/actions/setup-lms

      - name: Format
        run: pnpm run format:check

      - name: Lint
        run: pnpm run lint

      - name: Build
        run: pnpm run build

  unit:
    name: Unit test, kiến trúc và telemetry
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: lms
    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Set up toolchain
        uses: ./.github/actions/setup-lms

      # Gồm test:architecture, test:testbed:reset, test:seed-data, jest từng service và test:telemetry.
      - name: Unit test
        run: pnpm run test

  e2e:
    name: e2e ${{ matrix.service }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        service: [auth, student, course, media, notification, ai, scheduler]
    defaults:
      run:
        working-directory: lms
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_DB: auth_db
          POSTGRES_USER: lms_test
          POSTGRES_PASSWORD: lms_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lms_test -d auth_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      rabbitmq:
        image: rabbitmq:4.1.4-management-alpine
        env:
          RABBITMQ_DEFAULT_USER: lms_test
          RABBITMQ_DEFAULT_PASS: lms_test_password
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
          --health-start-period 20s
      minio:
        image: bitnamilegacy/minio:2025.7.23-debian-12-r5
        env:
          MINIO_ROOT_USER: lms-minio
          MINIO_ROOT_PASSWORD: lms-minio-local-only
          MINIO_DEFAULT_BUCKETS: images,videos,documents,audios,other
        ports:
          - 9000:9000
        options: >-
          --health-cmd "curl -fsS http://127.0.0.1:9000/minio/health/live"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
          --health-start-period 5s
      mailpit:
        image: axllent/mailpit:v1.31.6
        ports:
          - 1025:1025
          - 8025:8025
        options: >-
          --health-cmd "/mailpit readyz"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Set up toolchain
        uses: ./.github/actions/setup-lms

      - name: Create service database
        if: matrix.service != 'auth'
        run: psql -h 127.0.0.1 -d auth_db -c "CREATE DATABASE ${{ matrix.service }}_db"

      - name: Build
        run: pnpm run build

      - name: Migrate
        working-directory: lms/services/${{ matrix.service }}
        run: pnpm exec prisma migrate deploy

      - name: e2e
        run: pnpm run test:${{ matrix.service }}:e2e

  integration-db:
    name: Integration trên PostgreSQL và RabbitMQ thật
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: lms
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_DB: auth_db
          POSTGRES_USER: lms_test
          POSTGRES_PASSWORD: lms_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lms_test -d auth_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      rabbitmq:
        image: rabbitmq:4.1.4-management-alpine
        env:
          RABBITMQ_DEFAULT_USER: lms_test
          RABBITMQ_DEFAULT_PASS: lms_test_password
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
          --health-start-period 20s
    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Set up toolchain
        uses: ./.github/actions/setup-lms

      - name: Create databases
        run: |
          for database in student_db course_db media_db notification_db ai_db scheduler_db common_integration_db; do
            psql -h 127.0.0.1 -d auth_db -c "CREATE DATABASE $database"
          done

      - name: Build
        run: pnpm run build

      - name: Migrate all services
        run: |
          for service in auth student course media notification ai scheduler; do
            (cd "services/$service" && pnpm exec prisma migrate deploy)
          done

      # Outbox, inbox và consumer qua RabbitMQ thật; dùng database riêng vì test tự tạo và xóa bảng.
      - name: common integration
        run: pnpm --filter @aiops-lms/common run test:integration
        env:
          DATABASE_URL: postgresql://lms_test:lms_test_password@127.0.0.1:5432/common_integration_db
          RABBITMQ_URL: amqp://lms_test:lms_test_password@127.0.0.1:5672

      - name: Seeder trên PostgreSQL thật
        run: pnpm run test:seed-data:db --host 127.0.0.1 --port 5432 --user lms_test --password lms_test_password

  compose-config:
    name: Validate Compose without local configuration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Ensure local Compose configuration is absent
        run: test ! -e docker-compose/.env

      - name: Validate LMS Compose with committed example configuration
        run: docker compose --env-file docker-compose/.env.example -f docker-compose/compose.yaml config --quiet

      - name: Validate aiops-platform observability Compose with committed example configuration
        run: docker compose --env-file aiops-platform/observability/.env.example -f aiops-platform/observability/compose.yaml config --quiet

      - name: Validate full stack Compose (LMS + aiops-platform)
        run: docker compose --env-file docker-compose/.env.example -f docker-compose/compose.full.yaml config --quiet

  compose-reset:
    name: Reset/seed Testbed twice with stable fingerprint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Set up toolchain
        uses: ./.github/actions/setup-lms
        with:
          install: 'false'

      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android

      - name: Run reset guard tests
        run: pnpm --dir lms run test:testbed:reset

      - name: Reset twice and compare fingerprint
        run: pnpm --dir lms run test:testbed:reset:compose
