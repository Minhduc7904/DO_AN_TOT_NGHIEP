name: CI baseline

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    name: Clean install, quality gates and telemetry assertion
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lms
    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.13.1

      - name: Verify pinned toolchain
        run: |
          node --version
          pnpm --version

      - name: Clean install
        run: pnpm install --frozen-lockfile

      - name: Run quality gates
        run: pnpm run ci:verify

  compose-config:
    name: Validate Compose without local configuration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Ensure local Compose configuration is absent
        run: test ! -e docker-compose/.env

      - name: Validate Compose with committed example configuration
        run: docker compose --env-file docker-compose/.env.example -f docker-compose/compose.yaml config --quiet
